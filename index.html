<title>Kindred</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: three panes (companions · conversation · profile) collapsing to one swapped pane on phones. */
:root {
  --bg: #f4f1f5;
  --surface: #ffffff;
  --surface-2: #ece7ef;
  --ink: #1e1a23;
  --muted: #6b6274;
  --line: #ddd5e2;
  --accent: #d6455d;
  --accent-soft: #fbe3e7;
  --accent-ink: #ffffff;
  --you: #2b2431;
  --you-ink: #f6f1f8;
  --good: #2f8a5b;
  --warn: #b7791f;
  --shadow: 0 10px 30px rgba(40, 20, 50, .12);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Nunito Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131016; --surface: #1c1820; --surface-2: #26202b; --ink: #f1ebf3; --muted: #a497ab;
    --line: #342c3a; --accent: #ff6f84; --accent-soft: #3a1e27; --accent-ink: #1a0d11;
    --you: #ff6f84; --you-ink: #1a0d11; --good: #5cc98e; --warn: #e6b25a;
    --shadow: 0 10px 30px rgba(0, 0, 0, .45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131016; --surface: #1c1820; --surface-2: #26202b; --ink: #f1ebf3; --muted: #a497ab;
  --line: #342c3a; --accent: #ff6f84; --accent-soft: #3a1e27; --accent-ink: #1a0d11;
  --you: #ff6f84; --you-ink: #1a0d11; --good: #5cc98e; --warn: #e6b25a;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45); color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); overflow: hidden; }
* { box-sizing: border-box; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }

.app { height: 100%; display: grid; grid-template-columns: 290px minmax(0, 1fr) 320px; }
.app.no-panel { grid-template-columns: 290px minmax(0, 1fr); }
.app.no-panel .panel { display: none; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 14px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.05); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.icon-btn { width: 36px; height: 36px; padding: 0; border-radius: 50%; border: 0; background: transparent; display: inline-grid; place-items: center; color: var(--muted); }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn svg, .btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Sidebar */
.side { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 16px 12px; }
.brand-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); }
.brand-mark svg { width: 18px; height: 18px; fill: currentColor; }
.brand h1 { font-size: 22px; letter-spacing: -.01em; }
.side-actions { display: flex; gap: 8px; padding: 0 16px 12px; }
.side-actions .btn.primary { flex: 1; }
.side .search { margin: 0 16px 8px; padding: 8px 12px; width: auto; }
.list { flex: 1; overflow-y: auto; padding: 4px 8px 8px; display: flex; flex-direction: column; gap: 2px; }
.item { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px; border-radius: 12px; border: 0; background: transparent; text-align: left; width: 100%; }
.item:hover { background: var(--surface-2); }
.item.active { background: var(--accent-soft); }
.item-name { font-weight: 700; display: flex; gap: 6px; align-items: baseline; }
.item-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-rel { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; flex-shrink: 0; }
.item-last { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-foot { border-top: 1px solid var(--line); padding: 10px 12px; display: flex; gap: 4px; align-items: center; }
.side-foot .who { flex: 1; font-size: 13px; color: var(--muted); padding-left: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.provider-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex-shrink: 0; }
.dot.off { background: var(--warn); }

/* Avatar */
.av { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; color: #fff; background-size: cover; background-position: center; flex-shrink: 0; text-shadow: 0 1px 2px rgba(0,0,0,.25); user-select: none; }
.av.sm { width: 32px; height: 32px; font-size: 13px; }
.av.lg { width: 112px; height: 112px; font-size: 40px; }
.av.xl { width: 140px; height: 140px; font-size: 52px; }

/* Main */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.topbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface); min-height: 62px; }
.topbar .title { flex: 1; min-width: 0; }
.topbar .title h2 { font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.back { display: none; }

.home { flex: 1; overflow-y: auto; padding: 32px 24px; }
.home-inner { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
.home h2 { font-size: clamp(28px, 4vw, 40px); letter-spacing: -.02em; }
.home p.lede { color: var(--muted); max-width: 60ch; margin: 8px 0 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; text-align: left; }
.card:hover { border-color: var(--accent); }
.card .av { width: 64px; height: 64px; font-size: 24px; }
.card h3 { font-size: 18px; }
.card .meta { font-size: 13px; color: var(--muted); }
.card .blurb { font-size: 14px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card.new { border-style: dashed; justify-content: center; align-items: center; color: var(--muted); min-height: 200px; background: transparent; }
.tag { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.tag.mature { background: var(--accent-soft); color: var(--accent); }

/* Chat */
.chat { flex: 1; overflow-y: auto; padding: 24px 16px 8px; }
.chat-inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.scene-banner { align-self: center; font-size: 13px; color: var(--muted); background: var(--surface-2); padding: 6px 14px; border-radius: 999px; max-width: 100%; text-align: center; }
.msg { display: flex; gap: 10px; align-items: flex-end; max-width: 100%; }
.msg.user { flex-direction: row-reverse; }
.msg-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; max-width: min(78%, 620px); }
.msg.user .msg-body { align-items: flex-end; }
.bubble { padding: 10px 14px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.assistant .bubble { border-bottom-left-radius: 6px; }
.msg.user .bubble { background: var(--you); color: var(--you-ink); border-color: transparent; border-bottom-right-radius: 6px; }
.bubble em.act { color: var(--muted); font-style: italic; }
.msg.user .bubble em.act { color: inherit; opacity: .8; }
.bubble.err { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.msg-tools { display: flex; gap: 2px; align-items: center; opacity: 0; transition: opacity .15s; font-size: 12px; color: var(--muted); }
.msg:hover .msg-tools, .msg:focus-within .msg-tools, .msg.last .msg-tools { opacity: 1; }
.msg-tools .icon-btn { width: 28px; height: 28px; }
.msg-tools .icon-btn svg { width: 15px; height: 15px; }
.alt-nav { font-variant-numeric: tabular-nums; padding: 0 2px; }
.typing { display: inline-flex; gap: 4px; padding: 4px 0; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.edit-area { width: min(560px, 70vw); min-height: 90px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 10px; resize: vertical; }

.composer { padding: 10px 16px 14px; background: var(--bg); }
.composer-inner { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 6px 6px 6px 16px; }
.composer-inner:focus-within { border-color: var(--accent); }
.composer textarea { flex: 1; border: 0; border-radius: 0; background: transparent; resize: none; min-height: 0; max-height: 180px; padding: 8px 0; outline: none; min-width: 0; }
.send { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex-shrink: 0; }
.send svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.send.stop { background: var(--ink); color: var(--bg); }
.composer-hint { max-width: 760px; margin: 6px auto 0; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

/* Profile panel */
.panel { border-left: 1px solid var(--line); background: var(--surface); overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; min-height: 0; }
.panel-head { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.panel-head h3 { font-size: 22px; }
.panel-head .meta { color: var(--muted); font-size: 13px; }
.sect { display: flex; flex-direction: column; gap: 8px; }
.sect-title { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid transparent; }
.bond-bar { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bond-bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s; }
.bond-row { display: flex; justify-content: space-between; font-size: 13px; }
.bond-row b { font-family: var(--f-display); }
.bond-row span { color: var(--muted); font-variant-numeric: tabular-nums; }
.mem { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.mem li { display: flex; gap: 6px; align-items: flex-start; font-size: 14px; background: var(--bg); border-radius: 10px; padding: 6px 4px 6px 10px; }
.mem li span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.mem li .icon-btn { width: 24px; height: 24px; }
.mem li .icon-btn svg { width: 13px; height: 13px; }
.mem-add { display: flex; gap: 6px; }
.mem-add input { flex: 1; min-width: 0; }
.small { font-size: 13px; color: var(--muted); }
.panel-actions { display: flex; flex-wrap: wrap; gap: 8px; }

/* Forms */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .lbl { font-size: 13px; font-weight: 700; }
.field .hint { font-size: 12px; color: var(--muted); }
input[type="text"], input[type="number"], input[type="password"], input[type="url"], textarea, select { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 12px; }
textarea { resize: vertical; min-height: 80px; }
input:focus, textarea:focus, select:focus { border-color: var(--accent); outline: none; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
.err-text { color: var(--accent); font-size: 13px; font-weight: 600; }
.slider { display: grid; grid-template-columns: 110px minmax(0, 1fr) 90px; gap: 10px; align-items: center; font-size: 13px; }
.slider span:last-child { color: var(--muted); text-align: right; }
.slider input { accent-color: var(--accent); width: 100%; }
.pick { display: flex; flex-wrap: wrap; gap: 6px; }
.pick button { font-size: 13px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.pick button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.switch { display: flex; gap: 10px; align-items: flex-start; }
.switch input { width: 18px; height: 18px; accent-color: var(--accent); margin-top: 2px; flex-shrink: 0; }
.callout { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; font-size: 13px; }
.callout.warn { background: var(--accent-soft); }

/* Modal */
.scrim { position: fixed; inset: 0; background: rgba(15, 8, 20, .5); display: grid; place-items: center; padding: 16px; z-index: 20; }
.modal { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); width: min(760px, 100%); max-height: calc(100% - 16px); display: flex; flex-direction: column; min-height: 0; }
.modal.narrow { width: min(460px, 100%); }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.modal-head h2 { flex: 1; font-size: 20px; }
.modal-body { overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 18px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.tabs { display: flex; gap: 4px; padding: 0 20px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: transparent; padding: 12px 10px; font-weight: 700; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.look { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 20px; align-items: start; }
.hues { display: flex; gap: 14px; flex-wrap: wrap; }
.hues label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; flex: 1; min-width: 120px; }
.hues input[type="range"] { accent-color: var(--accent); }
.drafter { display: flex; gap: 8px; }
.drafter input { flex: 1; min-width: 0; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; z-index: 40; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.log li { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; font-size: 14px; }
.log b { font-family: var(--f-display); color: var(--accent); }

@media (max-width: 1100px) {
  .app { grid-template-columns: 270px minmax(0, 1fr); }
  .panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(340px, 92vw); z-index: 15; box-shadow: var(--shadow); padding-top: calc(20px + env(safe-area-inset-top, 0px)); }
}
@media (max-width: 720px) {
  .app, .app.no-panel { grid-template-columns: minmax(0, 1fr); }
  .app[data-view="chat"] .side, .app[data-view="home"] .side { display: none; }
  .app[data-view="list"] .main { display: none; }
  .back { display: inline-grid; }
  .msg-body { max-width: 86%; }
  .look { grid-template-columns: 1fr; justify-items: start; }
  .slider { grid-template-columns: 90px minmax(0, 1fr) 70px; }
  .home { padding: 20px 16px; }
  .composer-hint span:first-child { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div class="app" id="app" data-view="list"></div>
<div id="layer"></div>

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      s.settings = Object.assign(structuredClone(DEFAULT_SETTINGS), s.settings || {});
      s.settings.openai = Object.assign({}, DEFAULT_SETTINGS.openai, s.settings.openai || {});
      s.settings.anthropic = Object.assign({}, DEFAULT_SETTINGS.anthropic, s.settings.anthropic || {});
      s.characters = (s.characters || []).map(c => Object.assign(blankCharacter(), c));
      s.chats ||= {}; s.memories ||= {}; s.bond ||= {};
      return s;
    }
  } catch (e) { /* fall through to seed */ }
  return seed();
}
let S = load();
let saveWarned = false;
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); }
  catch (e) { if (!saveWarned) { saveWarned = true; toast("Couldn't save to this browser. Export your data from Settings to keep it."); } }
}

function initials(name) { return (name || "?").replace(/^(Professor|Dr\.?|Mr\.?|Ms\.?|Mrs\.?)\s+/i, "").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase() || "?"; }

}
function resizeImage(file, size = 256) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error("That file isn't an image this browser can read."));
      img.onload = () => {
        const cv = document.createElement("canvas"); cv.width = cv.height = size;
        const ctx = cv.getContext("2d"); const s = Math.min(img.width, img.height);
        ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
        res(cv.toDataURL("image/jpeg", 0.85));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ---------- providers ---------- */
let samplePromise = null;
function getSample() {
  if (!samplePromise) samplePromise = (window.claude && typeof window.claude.use === "function") ? window.claude.use("sample").catch(() => null) : Promise.resolve(null);
  return samplePromise;
}
let sampleReady = null; // true/false once known
getSample().then(s => { sampleReady = !!s; renderSideFoot(); });

function activeProvider() {
  const p = S.settings.provider;
  if (p !== "auto") return p;
  if (sampleReady) return "claude";
  if (S.settings.anthropic.apiKey) return "anthropic";
  if (S.settings.openai.apiKey || /localhost|127\.0\.0\.1/.test(S.settings.openai.baseUrl)) return "openai";
  return "demo";
}
const PROVIDER_NAMES = { claude: "Claude (built-in)", openai: "OpenAI-compatible", anthropic: "Anthropic API", demo: "Demo mode" };

function normalizeTurns(msgs) {
  const out = [];
  for (const m of msgs) {
    if (!m.content) continue;
    const last = out[out.length - 1];
    if (last && last.role === m.role) last.content += "\n\n" + m.content;
    else out.push({ role: m.role, content: m.content });
  }
  return out;
}

async function readSSE(res, onData) {
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "";
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n")) >= 0) {
      const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
      if (!line.startsWith("data:")) continue;
      const d = line.slice(5).trim();
      if (d === "[DONE]") return;
      try { onData(JSON.parse(d)); } catch (e) { /* ignore partial */ }
    }
  }
}

async function httpError(res) {
  let msg = "";
  try { const j = await res.json(); msg = j.error?.message || j.message || JSON.stringify(j).slice(0, 200); } catch (e) { msg = res.statusText; }
  const hint = res.status === 401 ? " Check your API key in Settings." : res.status === 404 ? " Check the base URL and model name in Settings." : res.status === 429 ? " You're being rate limited; wait a moment." : "";
  return new Error(`The provider returned ${res.status}: ${msg}.${hint}`);
}
function netError(e) {
  if (e.name === "AbortError") return e;
  const inViewer = window.parent !== window;
  return new Error(inViewer
    ? "This page can't reach outside APIs while it runs inside claude.ai. Switch to Claude (built-in) or Demo mode in Settings, or download the app and run it locally for custom APIs."
    : `Couldn't reach the provider (${e.message}). Check the base URL, your connection, and that the API allows browser requests (CORS).`);
}

/**
 * generate({system, messages, onText, signal, maxTokens, temperature}) -> full text
 * messages: [{role:'user'|'assistant', content}]
 */
async function generate({ system, messages, onText = () => {}, signal, maxTokens, temperature, quick = false }) {
  const st = S.settings, prov = activeProvider();
  maxTokens ??= st.maxTokens; temperature ??= st.temperature;
  let turns = normalizeTurns(messages);

  if (prov === "claude") {
    const sample = await getSample();
    if (!sample) throw new Error("Claude (built-in) only works when this app is opened on claude.ai. Pick another provider in Settings.");
    const head = `[Setup for this conversation, follow it for every reply]\n\n${system}\n\n[End of setup. Reply only with your next message, in character.]`;
    if (!turns.length || turns[0].role === "assistant") turns.unshift({ role: "user", content: head + "\n\n(The conversation begins.)" });
    else turns[0] = { role: "user", content: head + "\n\n" + turns[0].content };
    if (turns[turns.length - 1].role !== "user") turns.push({ role: "user", content: "(Continue.)" });
    try {
      const { text } = await sample(turns, { cache: false, signal, modelTier: quick ? "quick" : "default", onText: ({ text }) => onText(text) });
      return text;
    } catch (e) {
      if (e && e.code === "cancelled") { const err = new Error("Stopped"); err.name = "AbortError"; err.partial = e.text; throw err; }
      const copy = { not_granted: "Claude access wasn't allowed for this page. Reload and choose Allow, or pick another provider in Settings.", rate_limited: "Claude is rate limiting this page. Wait a minute and try again." };
      const err = new Error(copy[e?.code] || e?.message || "Claude couldn't answer."); err.partial = e?.text; throw err;
    }
  }

  if (prov === "anthropic") {
    const a = st.anthropic;
    if (!a.apiKey) throw new Error("Add your Anthropic API key in Settings.");
    if (turns[0]?.role === "assistant") turns.unshift({ role: "user", content: "(The conversation begins.)" });
    if (turns[turns.length - 1]?.role !== "user") turns.push({ role: "user", content: "(Continue.)" });
    let res;
    try {
      res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST", signal,
        headers: { "content-type": "application/json", "x-api-key": a.apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
        body: JSON.stringify({ model: a.model || "claude-sonnet-5-5", max_tokens: maxTokens, temperature: Math.min(temperature, 1), system, messages: turns, stream: true }),
      });
    } catch (e) { throw netError(e); }
    if (!res.ok) throw await httpError(res);
    let text = "";
    await readSSE(res, d => {
      if (d.type === "content_block_delta" && d.delta?.text) { text += d.delta.text; onText(text); }
      if (d.type === "error") throw new Error(d.error?.message || "Stream error");
    });
    return text;
  }

  if (prov === "openai") {
    const o = st.openai;
    if (!o.model) throw new Error("Set a model name for your OpenAI-compatible provider in Settings.");
    const headers = { "content-type": "application/json" };
    if (o.apiKey) headers.authorization = "Bearer " + o.apiKey;
    let res;
    try {
      res = await fetch(o.baseUrl.replace(/\/+$/, "") + "/chat/completions", {
        method: "POST", signal, headers,
        body: JSON.stringify({ model: o.model, temperature, max_tokens: maxTokens, stream: true, messages: [{ role: "system", content: system }, ...turns] }),
      });
    } catch (e) { throw netError(e); }
    if (!res.ok) throw await httpError(res);
    let text = "";
    await readSSE(res, d => { const t = d.choices?.[0]?.delta?.content; if (t) { text += t; onText(text); } });
    return text;
  }

  return demoGenerate({ system, turns, onText, signal });
}

/* Offline demo: canned but personality-flavored replies, streamed, so the UI can be tested with no AI at all. */
async function demoGenerate({ turns, onText, signal }) {
  const c = charById(S.activeId) || {};
  const last = (turns.filter(t => t.role === "user").pop()?.content || "").toLowerCase();
  if (/^\[draft\]|reply with only (a )?json/i.test(last) || /json/.test(turns[0]?.content?.slice(-400) || "")) {
    return JSON.stringify({ memories: ["(Demo mode) Memory extraction needs a real AI provider."] });
  }
  const you = S.settings.userName || "you";
  const playful = (c.sliders?.humor || 50) > 60, warm = (c.sliders?.warmth || 50) > 60;
  const opener = warm ? [`*smiles softly*`, `*leans closer*`, `*brightens up*`] : [`*raises an eyebrow*`, `*nods slowly*`, `*tilts head*`];
  const bodies = [
    `Okay, I'm listening. Tell me more about that, ${you}.`,
    playful ? `Ha! You can't just drop that on me without context. Details. Now.` : `That's interesting. What made you think of it?`,
    warm ? `I'm really glad you told me. How are you feeling about it?` : `Hm. I have opinions, but I want yours first.`,
    `You know what, that reminds me of something. ${c.interests ? "Have I ever told you how I got into " + c.interests.split(",")[0].trim().toLowerCase() + "?" : "Remind me to tell you later."}`,
  ];
  let reply = `${opener[hash(last) % 3]} ${bodies[hash(last + turns.length) % bodies.length]}`;
  if (/\b(hi|hey|hello|yo)\b/.test(last)) reply = `${opener[0]} Hey you. I was hoping you'd show up.`;
  reply += `\n\n(Demo mode: connect an AI in Settings for real replies.)`;
  let out = "";
  for (const w of reply.split(/(\s+)/)) {
    if (signal?.aborted) { const e = new Error("Stopped"); e.name = "AbortError"; e.partial = out; throw e; }
    out += w; onText(out);
    await new Promise(r => setTimeout(r, 18));
  }
  return out;
}

function extractJSON(text) {
  const m = text.match(/```(?:json)?\s*([\s\S]*?)```/); if (m) text = m[1];
  const start = text.search(/[{[]/); if (start < 0) throw new Error("No JSON found in reply.");
  const open = text[start], close = open === "{" ? "}" : "]";
  return JSON.parse(text.slice(start, text.lastIndexOf(close) + 1));
}

function msgHTML(m, i, arr, c) {
  const isLast = i === arr.length - 1;
  if (ui.editingMsg === m.id) {
    return `<div class="msg ${m.role}"><div class="msg-body"><textarea class="edit-area" id="editArea">${esc(m.content)}</textarea>
      <div class="msg-tools" style="opacity:1"><button class="btn" data-act="cancel-edit">Cancel</button><button class="btn primary" data-act="save-edit" data-id="${m.id}">Save</button></div></div></div>`;
  }
  const alts = m.alts && m.alts.length > 1 ? `<button class="icon-btn" data-act="alt-prev" data-id="${m.id}" aria-label="Previous reply">${ic("left")}</button><span class="alt-nav">${m.altIndex + 1}/${m.alts.length}</span><button class="icon-btn" data-act="alt-next" data-id="${m.id}" aria-label="Next reply">${ic("right")}</button>` : "";
  const tools = `<div class="msg-tools">
      ${alts}
      ${isLast && m.role === "assistant" ? `<button class="icon-btn" data-act="regen" title="New reply" aria-label="Generate a different reply">${ic("redo")}</button>` : ""}
      <button class="icon-btn" data-act="remember" data-id="${m.id}" title="Remember this" aria-label="Save to memories">${ic("pin")}</button>
      <button class="icon-btn" data-act="copy" data-id="${m.id}" title="Copy" aria-label="Copy message">${ic("copy")}</button>
      <button class="icon-btn" data-act="edit-msg" data-id="${m.id}" title="Edit" aria-label="Edit message">${ic("edit")}</button>
      <button class="icon-btn" data-act="del-msg" data-id="${m.id}" title="Delete" aria-label="Delete message">${ic("trash")}</button>
    </div>`;
  return `<div class="msg ${m.role} ${isLast ? "last" : ""}" data-mid="${m.id}">
    ${m.role === "assistant" ? avatarHTML(c, "sm") : ""}
    <div class="msg-body"><div class="bubble ${m.error ? "err" : ""}">${fmt(m.content)}</div>${tools}</div></div>`;
}
function renderMsgs(scroll = true) {
  const c = charById(S.activeId), box = $("#msgs"); if (!box || !c) return;
  const msgs = chatOf(c.id);
  box.innerHTML = (c.scene ? `<div class="scene-banner">Scene: ${esc(c.scene)}</div>` : "") +
    (msgs.length ? msgs.map((m, i, a) => msgHTML(m, i, a, c)).join("") : `<div class="scene-banner">Say hello to start your story with ${esc(c.name)}.</div>`) +
    (ui.busy && ui.busy.pending ? `<div class="msg assistant" id="pending">${avatarHTML(c, "sm")}<div class="msg-body"><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div></div></div>` : "");
  if (ui.editingMsg) { const ea = $("#editArea"); ea?.focus(); }
  if (scroll) scrollChat();
}
function scrollChat() { const ch = $("#chat"); if (ch) ch.scrollTop = ch.scrollHeight; }
function autosize(t) { t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 180) + "px"; }
function setBusyUI() {
  const b = $("#sendBtn"); if (!b) return;
  const busy = ui.busy && ui.busy.charId === S.activeId;
  b.classList.toggle("stop", !!busy);
  b.innerHTML = busy ? ic("stop") : ic("send");
  b.dataset.act = busy ? "stop" : "send";
  b.setAttribute("aria-label", busy ? "Stop" : "Send");
}

    <div style="display:flex;justify-content:flex-end;margin:-8px -8px 0"><button class="icon-btn" data-act="panel" aria-label="Close profile">${ic("x")}</button></div>

/* ---------- chat actions ---------- */
async function send(text) {
  const c = charById(S.activeId); if (!c || ui.busy) return;
  const msgs = chatOf(c.id);
  if (text) {
    msgs.push({ id: uid(), role: "user", content: text, ts: Date.now() });
    S.bond[c.id] = (S.bond[c.id] || 0) + 1;
    if (ui.drafts) delete ui.drafts[c.id];
    save(); renderPanel();
  }
  await reply(c);
}

async function reply(c, target /* existing message to add an alternative to */) {
  const ctl = new AbortController();
  ui.busy = { charId: c.id, ctl, pending: true };
  const msgs = chatOf(c.id);
  const history = (target ? msgs.slice(0, msgs.indexOf(target)) : msgs).filter(m => !m.error).slice(-S.settings.historyLimit);
  renderMsgs(); setBusyUI(); renderList();
  let live = null;
  const onText = t => {
    if (S.activeId !== c.id) return;
    if (!live) {
      $("#pending")?.remove();
      if (target) live = $(`[data-mid="${target.id}"] .bubble`);
      else { $("#msgs")?.insertAdjacentHTML("beforeend", `<div class="msg assistant" id="streaming">${avatarHTML(c, "sm")}<div class="msg-body"><div class="bubble"></div></div></div>`); live = $("#streaming .bubble"); }
    }
    if (live) { live.innerHTML = fmt(t); const ch = $("#chat"); if (ch && ch.scrollHeight - ch.scrollTop - ch.clientHeight < 160) scrollChat(); }
  };
  let text = "", error = null;
  try {
    text = (await generate({ system: systemPrompt(c), messages: history, onText, signal: ctl.signal })).trim();
  } catch (e) {
    text = (e.partial || "").trim();
    if (e.name !== "AbortError") error = e.message || String(e);
  }
  ui.busy = null;
  if (text) {
    if (target) { target.alts ||= [target.content]; target.alts.push(text); target.altIndex = target.alts.length - 1; target.content = text; }
    else msgs.push({ id: uid(), role: "assistant", content: text, ts: Date.now() });
  }
  if (error) msgs.push({ id: uid(), role: "assistant", content: error, ts: Date.now(), error: true });
  save();
  if (S.activeId === c.id) { renderMsgs(); setBusyUI(); }
  renderList();
}

function regen() {
  const c = charById(S.activeId); if (!c || ui.busy) return;
  const msgs = chatOf(c.id);
  while (msgs.length && msgs[msgs.length - 1].error) msgs.pop();
  const last = msgs[msgs.length - 1];
  if (last && last.role === "assistant" && msgs.length > 1) reply(c, last);
  else if (last && last.role === "assistant") { msgs.pop(); reply(c); }
  else reply(c);
}

async function autoMemories() {
  const c = charById(S.activeId); if (!c) return;
  const recent = chatOf(c.id).filter(m => !m.error).slice(-30);
  if (recent.length < 2) { toast("Chat a little first, then try again."); return; }
  const you = S.settings.userName || "the user";
  const transcript = recent.map(m => `${m.role === "user" ? you : c.name}: ${m.content}`).join("\n");
  const existing = memOf(c.id);
  toast("Reading the conversation…");
  try {
    const out = await generate({
      quick: true, maxTokens: 500, temperature: 0.3,
      system: "You extract durable memories from a chat for a companion character. Reply with only JSON.",
      messages: [{ role: "user", content: `From this conversation between ${you} and ${c.name}, list up to 6 short, durable facts worth remembering long-term (about ${you}'s life, preferences, plans, feelings, and key shared moments). Skip anything already known.\n\nAlready known:\n${existing.map(m => "- " + m).join("\n") || "(none)"}\n\nConversation:\n${transcript}\n\nReply with only a JSON object like {"memories": ["${you} has a sister named Lea", "..."]}.` }],
    });
    const j = extractJSON(out);
    const add = (j.memories || []).map(s => String(s).trim()).filter(s => s && !existing.includes(s));
    existing.push(...add); save(); renderPanel();
    toast(add.length ? `Remembered ${add.length} new thing${add.length > 1 ? "s" : ""}.` : "Nothing new to remember.");
  } catch (e) { toast("Couldn't update memories: " + (e.message || e)); }
}

/* ---------- modals ---------- */
function openModal(html, { narrow = false, onClose } = {}) {
  layer.innerHTML = `<div class="scrim" id="scrim"><div class="modal ${narrow ? "narrow" : ""}" role="dialog" aria-modal="true">${html}</div></div>`;
  const scrim = $("#scrim");
  scrim.addEventListener("mousedown", e => { if (e.target === scrim) closeModal(); });
  layer._onClose = onClose;
  setTimeout(() => $("#scrim .modal input, #scrim .modal textarea, #scrim .modal button")?.focus(), 0);
  return $("#scrim .modal");
}
function closeModal() { layer.innerHTML = ""; const f = layer._onClose; layer._onClose = null; f && f(); }
function askConfirm(message, okLabel = "Confirm") {
  return new Promise(res => {
    const m = openModal(`<div class="modal-head"><h2>Are you sure?</h2></div><div class="modal-body"><p style="margin:0">${esc(message)}</p></div>
      <div class="modal-foot"><button class="btn" data-x="no">Cancel</button><button class="btn primary" data-x="yes">${esc(okLabel)}</button></div>`, { narrow: true, onClose: () => res(false) });
    m.addEventListener("click", e => { const b = e.target.closest("[data-x]"); if (!b) return; layer._onClose = null; layer.innerHTML = ""; res(b.dataset.x === "yes"); });
  });
}
let toastTimer;
function toast(msg) {
  $(".toast")?.remove(); clearTimeout(toastTimer);
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
  document.body.appendChild(t); toastTimer = setTimeout(() => t.remove(), 3200);
}

/* ---------- character editor ---------- */
function openEditor(existing) {
  const c = structuredClone(existing || blankCharacter());
  if (!existing) { c.hueA = Math.floor(Math.random() * 360); c.hueB = (c.hueA + 40 + Math.floor(Math.random() * 60)) % 360; }
  let tab = "identity";
  const matureOK = S.settings.mature && S.settings.ageConfirmed;

  const tabs = [["identity", "Identity"], ["look", "Look"], ["personality", "Personality"], ["story", "Story"], ["chat", "Chat style"]];
  const pick = (name, options, value) => `<div class="pick" data-pick="${name}">${options.map(o => `<button type="button" aria-pressed="${o === value}" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;

  const body = () => {
    if (tab === "identity") return `
      <div class="callout"><div class="lbl" style="margin-bottom:6px">${ic("spark")} Draft with AI</div>
        <div class="drafter"><input type="text" id="draftIdea" placeholder="e.g. a sarcastic astronaut girlfriend who secretly writes poetry"><button class="btn primary" type="button" data-e="draft">Draft</button></div>
        <div class="hint small" style="margin-top:6px">Fills in every tab from your idea. You can edit anything afterward.</div></div>
      <div class="row">
        <div class="field"><label for="f-name">Name</label><input type="text" id="f-name" data-f="name" value="${esc(c.name)}" placeholder="Their name"></div>
        <div class="field"><label for="f-age">Age</label><input type="number" id="f-age" data-f="age" min="18" max="120" value="${esc(c.age)}"><span class="hint">Companions are always adults (18+).</span></div>
      </div>
      <div class="field"><span class="lbl">Gender</span>${pick("gender", GENDERS, c.gender)}
        ${c.gender === "Custom" ? `<input type="text" data-f="genderCustom" value="${esc(c.genderCustom)}" placeholder="Describe their gender">` : ""}</div>
      <div class="field"><label for="f-pronouns">Pronouns</label><input type="text" id="f-pronouns" data-f="pronouns" value="${esc(c.pronouns)}"></div>
      <div class="field"><span class="lbl">They are your…</span>${pick("relationship", RELATIONSHIPS, c.relationship)}
        ${c.relationship === "Custom" ? `<input type="text" data-f="relationshipCustom" value="${esc(c.relationshipCustom)}" placeholder="e.g. Pen pal, Fiancée, Bandmate">` : ""}</div>
      <div class="field"><label for="f-occ">Occupation</label><input type="text" id="f-occ" data-f="occupation" value="${esc(c.occupation)}" placeholder="What they do"></div>`;
    if (tab === "look") return `
      <div class="look">
        <div style="display:flex;flex-direction:column;gap:10px;align-items:center">${avatarHTML(c, "xl")}
          <label class="btn" for="f-photo">Upload photo</label><input type="file" id="f-photo" accept="image/*" hidden>
          ${c.photo ? `<button class="btn ghost" type="button" data-e="clear-photo">Use colors instead</button>` : ""}</div>
        <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
          <div class="hues"><label>Color one<input type="range" min="0" max="359" data-f="hueA" value="${c.hueA}"></label><label>Color two<input type="range" min="0" max="359" data-f="hueB" value="${c.hueB}"></label></div>
          <div class="field"><label for="f-app">Appearance</label><textarea id="f-app" data-f="appearance" rows="5" placeholder="Hair, eyes, build, style, scent, the little details">${esc(c.appearance)}</textarea><span class="hint">Your companion uses this to describe themselves in scenes.</span></div>
        </div>
      </div>`;
    if (tab === "personality") return `
      <div class="field"><span class="lbl">Traits</span>
        <div class="pick" data-multi="traits">${TRAITS.map(t => `<button type="button" aria-pressed="${c.traits.includes(t)}" data-v="${t}">${t}</button>`).join("")}</div></div>
      <div class="field"><label for="f-ct">Other traits</label><input type="text" id="f-ct" data-f="customTraits" value="${esc(c.customTraits)}" placeholder="Comma separated, e.g. jealous, night owl"></div>
      <div class="field"><span class="lbl">Temperament</span>
        ${SLIDERS.map(([k, label, words]) => { const v = c.sliders[k]; return `<div class="slider"><span>${label}</span><input type="range" min="0" max="100" data-s="${k}" value="${v}" aria-label="${label}"><span data-sw="${k}">${words[v < 34 ? 0 : v < 67 ? 1 : 2]}</span></div>`; }).join("")}</div>`;

      <label class="switch"><input type="checkbox" id="f-mature" data-f="mature" ${c.mature ? "checked" : ""} ${matureOK ? "" : "disabled"}>
        <span><b>Mature content (18+)</b><br><span class="small">${matureOK ? "Allows romance and adult themes with this companion, within your AI provider's policies." : "Turn on mature content in Settings first. It requires confirming you're 18 or older."}</span></span></label>`;
  };

  const m = openModal(`
    <div class="modal-head"><h2>${existing ? "Edit " + esc(existing.name) : "New companion"}</h2><button class="icon-btn" data-e="close" aria-label="Close">${ic("x")}</button></div>

  const paint = () => { $("#edBody").innerHTML = body(); $$("[data-tab]", m).forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab)); };
  paint();

  m.addEventListener("input", e => {
    const t = e.target;
    if (t.dataset.f) {
      const f = t.dataset.f;
      c[f] = t.type === "checkbox" ? t.checked : (t.type === "range" || t.type === "number") ? Number(t.value) : t.value;
      if (f === "hueA" || f === "hueB") { const av = $(".look .av", m); if (av && !c.photo) av.outerHTML = avatarHTML(c, "xl"); }
    }
    if (t.dataset.s) { const v = Number(t.value); c.sliders[t.dataset.s] = v; const w = SLIDERS.find(s => s[0] === t.dataset.s)[2]; $(`[data-sw="${t.dataset.s}"]`, m).textContent = w[v < 34 ? 0 : v < 67 ? 1 : 2]; }
  });
  m.addEventListener("change", async e => {
    if (e.target.id === "f-photo" && e.target.files[0]) {
      try { c.photo = await resizeImage(e.target.files[0]); paint(); } catch (err) { toast(err.message || "Couldn't read that image."); }
    }
  });
  m.addEventListener("click", async e => {
    const tb = e.target.closest("[data-tab]"); if (tb) { tab = tb.dataset.tab; paint(); return; }
    const pb = e.target.closest("[data-pick] button");
    if (pb) { const k = pb.parentElement.dataset.pick; c[k] = pb.dataset.v; if (k === "gender") c.pronouns = { Woman: "she/her", Man: "he/him", "Non-binary": "they/them" }[c.gender] || c.pronouns; paint(); return; }
    const mb = e.target.closest("[data-multi] button");
    if (mb) { const v = mb.dataset.v; c.traits = c.traits.includes(v) ? c.traits.filter(x => x !== v) : [...c.traits, v]; mb.setAttribute("aria-pressed", c.traits.includes(v)); return; }
    const act = e.target.closest("[data-e]")?.dataset.e;
    if (act === "close") closeModal();
    if (act === "clear-photo") { c.photo = ""; paint(); }
    if (act === "draft") {
      const idea = $("#draftIdea").value.trim(); if (!idea) { $("#draftIdea").focus(); return; }
      const btn = e.target.closest("button"); btn.disabled = true; btn.textContent = "Drafting…";
      try { Object.assign(c, await draftCharacter(idea, c)); paint(); toast("Drafted. Look through the tabs and tweak anything."); }
      catch (err) { toast("Couldn't draft: " + (err.message || err)); }
      finally { if (btn.isConnected) { btn.disabled = false; btn.textContent = "Draft"; } }
    }
    if (act === "save") {
      const err = $("#edErr");
      if (!c.name.trim()) { err.textContent = "Give them a name."; tab = "identity"; paint(); return; }
      if (!(c.age >= 18)) { err.textContent = "Companions must be 18 or older."; tab = "identity"; paint(); return; }
      if (!(S.settings.mature && S.settings.ageConfirmed)) c.mature = false;
      c.name = c.name.trim(); c.example = false;
      if (existing) {
        const i = S.characters.findIndex(x => x.id === existing.id); S.characters[i] = c;
      } else {
        S.characters.push(c);
        S.chats[c.id] = c.greeting ? [{ id: uid(), role: "assistant", content: c.greeting, ts: Date.now() }] : [];
      }
      S.activeId = c.id; ui.view = "chat"; save(); closeModal(); render();
      toast(existing ? "Saved." : `${c.name} is ready to talk.`);
    }
  });
}

async function draftCharacter(idea, current) {
  const out = await generate({
    maxTokens: 1400, temperature: 0.9,
    system: "You design characters for a companion chat app. Every character is an adult (18+). Reply with only JSON.",
    messages: [{ role: "user", content: `[draft] Design a companion character from this idea: "${idea}".
Reply with only a JSON object with these keys:
name (string), age (integer, 18 or older), gender ("Woman"|"Man"|"Non-binary"), pronouns, relationship (one of ${RELATIONSHIPS.filter(r => r !== "Custom").join(", ")}), occupation, appearance (2-3 sentences), traits (3-5 picked from: ${TRAITS.join(", ")}), customTraits (comma separated extras), sliders ({warmth, humor, flirt, energy, boldness}, each 0-100), backstory (3-4 sentences, include how they know the user), interests, likes, dislikes, quirks, speech (how they talk), greeting (their first message, in character, using *asterisks* for actions), scene (a short starting scene).` }],
  });
  const j = extractJSON(out);
  const r = {};
  for (const k of ["name", "pronouns", "occupation", "appearance", "customTraits", "backstory", "interests", "likes", "dislikes", "quirks", "speech", "greeting", "scene"]) if (typeof j[k] === "string") r[k] = j[k];
  if (GENDERS.includes(j.gender)) r.gender = j.gender;
  if (RELATIONSHIPS.includes(j.relationship)) r.relationship = j.relationship;
  if (Number.isFinite(+j.age)) r.age = Math.max(18, Math.round(+j.age));
  if (Array.isArray(j.traits)) r.traits = j.traits.filter(t => TRAITS.includes(t));
  if (j.sliders && typeof j.sliders === "object") r.sliders = Object.assign({}, current.sliders, ...SLIDERS.map(([k]) => Number.isFinite(+j.sliders[k]) ? { [k]: clamp(Math.round(+j.sliders[k]), 0, 100) } : {}));
  if (!r.name) throw new Error("The reply didn't include a character.");
  return r;
}

/* ---------- settings ---------- */
function openSettings() {
  const st = structuredClone(S.settings);
  const paint = () => {
    const p = st.provider;
    const eff = p === "auto" ? activeProviderFor(st) : p;
    return `
    <div class="modal-head"><h2>Settings</h2><button class="icon-btn" data-s="close" aria-label="Close">${ic("x")}</button></div>
    <div class="modal-body">
      <div class="sect"><div class="sect-title">About you</div>
        <div class="row"><div class="field"><label for="s-name">Your name</label><input type="text" id="s-name" data-k="userName" value="${esc(st.userName)}" placeholder="What companions call you"></div></div>
        <div class="field"><label for="s-about">About you</label><textarea id="s-about" data-k="userAbout" rows="3" placeholder="Anything you want every companion to know: age, job, what you're into, what's going on in your life">${esc(st.userAbout)}</textarea></div>
      </div>
      <div class="sect"><div class="sect-title">AI provider</div>
        <select id="s-prov" data-k="provider">
          ${[["auto", "Automatic"], ["claude", "Claude (built-in on claude.ai)"], ["openai", "OpenAI-compatible (OpenRouter, LM Studio, Ollama, OpenAI…)"], ["anthropic", "Anthropic API (your key)"], ["demo", "Demo mode (offline, canned replies)"]].map(([v, l]) => `<option value="${v}" ${p === v ? "selected" : ""}>${l}</option>`).join("")}
        </select>
        <div class="small">Currently using: <b>${PROVIDER_NAMES[eff]}</b></div>
        ${eff === "claude" || p === "claude" ? `<div class="callout">Uses your own Claude account when this page is open on claude.ai. Nothing to configure. Claude keeps to Anthropic's usage policies, so explicit content isn't available with this provider.</div>` : ""}
        ${p === "openai" ? `
          <div class="field"><label for="s-ob">Base URL</label><input type="url" id="s-ob" data-k="openai.baseUrl" value="${esc(st.openai.baseUrl)}"><span class="hint">OpenRouter: https://openrouter.ai/api/v1 · LM Studio: http://localhost:1234/v1 · Ollama: http://localhost:11434/v1</span></div>
          <div class="row"><div class="field"><label for="s-ok">API key</label><input type="password" id="s-ok" data-k="openai.apiKey" value="${esc(st.openai.apiKey)}" placeholder="Not needed for local servers" autocomplete="off"></div>
          <div class="field"><label for="s-om">Model</label><input type="text" id="s-om" data-k="openai.model" value="${esc(st.openai.model)}" placeholder="e.g. meta-llama/llama-3.3-70b-instruct"></div></div>` : ""}
        ${p === "anthropic" ? `
          <div class="row"><div class="field"><label for="s-ak">API key</label><input type="password" id="s-ak" data-k="anthropic.apiKey" value="${esc(st.anthropic.apiKey)}" autocomplete="off"></div>
          <div class="field"><label for="s-am">Model</label><input type="text" id="s-am" data-k="anthropic.model" value="${esc(st.anthropic.model)}"></div></div>` : ""}
        ${(p === "openai" || p === "anthropic") ? `<div class="callout warn">Your key stays in this browser only. Outside APIs are blocked while the app runs inside claude.ai, so use these when you run Kindred locally (see the README).</div>` : ""}
        <div class="row">
          <div class="field"><label for="s-temp">Creativity (temperature): <span id="tempV">${st.temperature}</span></label><input type="range" id="s-temp" min="0" max="1.5" step="0.05" data-k="temperature" value="${st.temperature}" style="accent-color:var(--accent)"></div>
          <div class="field"><label for="s-max">Max reply length (tokens)</label><input type="number" id="s-max" min="64" max="4000" data-k="maxTokens" value="${st.maxTokens}"></div>
          <div class="field"><label for="s-hist">Messages of context</label><input type="number" id="s-hist" min="4" max="200" data-k="historyLimit" value="${st.historyLimit}"></div>
        </div>
      </div>
      <div class="sect"><div class="sect-title">Mature content</div>
        <label class="switch"><input type="checkbox" id="s-age" data-k="ageConfirmed" ${st.ageConfirmed ? "checked" : ""}><span><b>I confirm I'm 18 or older</b></span></label>
        <label class="switch"><input type="checkbox" id="s-mature" data-k="mature" ${st.mature ? "checked" : ""} ${st.ageConfirmed ? "" : "disabled"}><span><b>Allow mature (18+) companions</b><br><span class="small">Unlocks a per-companion 18+ switch. What's actually allowed depends on the AI provider you use. All companions are adults.</span></span></label>
      </div>
    </div>
    <div class="modal-foot"><button class="btn" data-s="close">Cancel</button><button class="btn primary" data-s="save">Save settings</button></div>`;
  };
  const m = openModal(paint());
  const repaint = () => { const scroll = $(".modal-body", m)?.scrollTop; m.innerHTML = paint(); $(".modal-body", m).scrollTop = scroll || 0; };
  const setK = (k, v) => { const [a, b] = k.split("."); if (b) st[a][b] = v; else st[a] = v; };
  m.addEventListener("input", e => {
    const k = e.target.dataset.k; if (!k) return;
    const t = e.target;
    setK(k, t.type === "checkbox" ? t.checked : (t.type === "range" || t.type === "number") ? Number(t.value) : t.value);
    if (k === "temperature") $("#tempV").textContent = t.value;
    if (k === "provider") repaint();
    if (k === "ageConfirmed") { if (!t.checked) st.mature = false; repaint(); }
  });
  m.addEventListener("click", e => {
    const a = e.target.closest("[data-s]")?.dataset.s;
    if (a === "close") closeModal();
    if (a === "save") {
      st.maxTokens = clamp(st.maxTokens || 600, 64, 4000); st.historyLimit = clamp(st.historyLimit || 40, 4, 200);
      if (!st.ageConfirmed) st.mature = false;
      S.settings = st; save(); closeModal(); render(); toast("Settings saved.");
    }
  });
}
function activeProviderFor(st) { const keep = S.settings; S.settings = st; const p = activeProvider(); S.settings = keep; return p; }

function openData() {
  const exportData = () => JSON.stringify({ app: "kindred", version: VERSION, characters: S.characters, chats: S.chats, memories: S.memories, bond: S.bond }, null, 1);
  const m = openModal(`
    <div class="modal-head"><h2>Import and export</h2><button class="icon-btn" data-d="close" aria-label="Close">${ic("x")}</button></div>
    <div class="modal-body">
      <p class="small" style="margin:0">Everything lives in this browser. Copy the backup below to keep it safe or move it to another device. Settings and API keys aren't included.</p>
      <div class="field"><label for="d-text">Backup</label><textarea id="d-text" rows="10" style="font-family:ui-monospace,monospace;font-size:12px"></textarea></div>
      <div class="panel-actions"><button class="btn" data-d="copy">${ic("copy")} Copy backup</button><button class="btn" data-d="export-one">Show current companion only</button></div>
      <div class="field"><span class="lbl">Import</span><span class="hint">Paste a backup (or a single shared companion) into the box above, then choose Import. Imported companions are added alongside yours.</span>
        <div class="panel-actions"><button class="btn primary" data-d="import">Import from box</button><label class="btn" for="d-file">Choose file…</label><input type="file" id="d-file" accept=".json,application/json" hidden></div></div>
    </div>`);
  const ta = $("#d-text", m); ta.value = exportData();
  const doImport = text => {
    try {
      const j = JSON.parse(text);
      const chars = j.characters || (j.name ? [j] : []);
      if (!chars.length) throw new Error("No companions found in that backup.");
      let n = 0;
      for (const raw of chars) {
        const c = Object.assign(blankCharacter(), raw);
        const oldId = c.id;
        if (charById(c.id)) c.id = uid();
        c.age = Math.max(18, Number(c.age) || 18); c.example = false;
        S.characters.push(c);
        S.chats[c.id] = j.chats?.[oldId] || (c.greeting ? [{ id: uid(), role: "assistant", content: c.greeting, ts: Date.now() }] : []);
        if (j.memories?.[oldId]) S.memories[c.id] = j.memories[oldId];
        if (j.bond?.[oldId]) S.bond[c.id] = j.bond[oldId];
        n++;
      }
      save(); closeModal(); render(); toast(`Imported ${n} companion${n > 1 ? "s" : ""}.`);
    } catch (e) { toast("Couldn't import: " + e.message); }
  };
  m.addEventListener("change", e => { const f = e.target.files?.[0]; if (f) f.text().then(doImport); });
  m.addEventListener("click", e => {
    const a = e.target.closest("[data-d]")?.dataset.d;
    if (a === "close") closeModal();
    if (a === "copy") { navigator.clipboard?.writeText(ta.value).then(() => toast("Backup copied."), () => { ta.select(); toast("Press Ctrl+C (or ⌘C) to copy."); }) ?? (ta.select(), toast("Press Ctrl+C to copy.")); }
    if (a === "export-one") { const c = charById(S.activeId); if (!c) { toast("Open a companion first."); return; } const x = structuredClone(c); delete x.id; ta.value = JSON.stringify(x, null, 1); }
    if (a === "import") doImport(ta.value);
  });
}

function openAbout() {
  openModal(`
    <div class="modal-head"><h2>Kindred ${VERSION}</h2><button class="icon-btn" data-a="close" aria-label="Close">${ic("x")}</button></div>
    <div class="modal-body">
      <p style="margin:0">Design AI companions and talk to them. Your companions, chats and memories are saved in this browser.</p>
      <div class="sect"><div class="sect-title">Build log</div><ul class="log">${BUILD_LOG.map(([v, t]) => `<li><b>${v}</b><span>${esc(t)}</span></li>`).join("")}</ul></div>
    </div>`, { narrow: true }).addEventListener("click", e => { if (e.target.closest("[data-a]")) closeModal(); });
}

/* ---------- events ---------- */
function openChar(id) {
  S.activeId = id; ui.view = "chat"; ui.editingMsg = null; save(); render();
}
app.addEventListener("click", async e => {
  const open = e.target.closest("[data-open]"); if (open) { openChar(open.dataset.open); return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, c = charById(S.activeId), msgs = c ? chatOf(c.id) : [];
  const msg = el.dataset.id ? msgs.find(m => m.id === el.dataset.id) : null;
  switch (act) {
    case "new": openEditor(); break;
    case "edit": if (c) openEditor(c); break;
    case "settings": openSettings(); break;
    case "data": openData(); break;
    case "about": openAbout(); break;
    case "list": ui.view = window.innerWidth <= 720 ? "list" : "home"; render(); break;
    case "panel": ui.panel = !ui.panel; render(); break;
    case "send": { const t = $("#input"); const v = t.value.trim(); if (!v && !msgs.length) return; t.value = ""; autosize(t); send(v); break; }
    case "stop": ui.busy?.ctl.abort(); break;
    case "regen": regen(); break;
    case "copy": if (msg) navigator.clipboard?.writeText(msg.content).then(() => toast("Copied."), () => toast("Copy isn't available here.")); break;
    case "remember": if (msg) { const s = msg.content.replace(/\s+/g, " ").trim().slice(0, 240); memOf(c.id).push((msg.role === "user" ? "You said: " : `${c.name.split(" ")[0]} said: `) + s); save(); renderPanel(); toast("Saved to memories."); } break;
    case "edit-msg": if (msg && !ui.busy) { ui.editingMsg = msg.id; renderMsgs(false); } break;
    case "cancel-edit": ui.editingMsg = null; renderMsgs(false); break;
    case "save-edit": if (msg) { const v = $("#editArea").value.trim(); if (v) { msg.content = v; if (msg.alts) msg.alts[msg.altIndex] = v; msg.error = false; } ui.editingMsg = null; save(); renderMsgs(false); renderList(); } break;
    case "del-msg": if (msg && !ui.busy) { msgs.splice(msgs.indexOf(msg), 1); save(); renderMsgs(false); renderList(); } break;
    case "alt-prev": case "alt-next": if (msg && !ui.busy) { msg.altIndex = (msg.altIndex + (act === "alt-next" ? 1 : -1) + msg.alts.length) % msg.alts.length; msg.content = msg.alts[msg.altIndex]; save(); renderMsgs(false); } break;
    case "auto-mem": autoMemories(); break;
    case "del-mem": memOf(c.id).splice(Number(el.dataset.i), 1); save(); renderPanel(); break;
    case "duplicate": { const d = structuredClone(c); d.id = uid(); d.name += " (copy)"; d.example = false; d.created = Date.now(); S.characters.push(d); S.chats[d.id] = d.greeting ? [{ id: uid(), role: "assistant", content: d.greeting, ts: Date.now() }] : []; save(); openChar(d.id); toast("Duplicated."); break; }
    case "clear-chat": if (await askConfirm(`Restart your chat with ${c.name}? Messages are deleted. Memories and bond stay.`, "Restart chat")) { ui.busy?.ctl.abort(); S.chats[c.id] = c.greeting ? [{ id: uid(), role: "assistant", content: c.greeting, ts: Date.now() }] : []; save(); render(); } break;
    case "delete-char": if (await askConfirm(`Delete ${c.name} for good? Their chat and memories go too.`, "Delete")) { ui.busy?.ctl.abort(); S.characters = S.characters.filter(x => x.id !== c.id); delete S.chats[c.id]; delete S.memories[c.id]; delete S.bond[c.id]; S.activeId = null; ui.view = window.innerWidth <= 720 ? "list" : "home"; save(); render(); toast("Deleted."); } break;
  }
});
app.addEventListener("input", e => {
  if (e.target.id === "search") { ui.search = e.target.value; renderList(); }
  if (e.target.id === "input") { autosize(e.target); (ui.drafts ||= {})[S.activeId] = e.target.value; }
});
app.addEventListener("keydown", e => {
  if (e.target.id === "input" && e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!ui.busy) $("#sendBtn").click(); }
  if (e.target.id === "editArea" && e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $('[data-act="save-edit"]')?.click(); }
  if (e.target.id === "editArea" && e.key === "Escape") { ui.editingMsg = null; renderMsgs(false); }
  if (e.target.id === "sceneInput" && e.key === "Enter") { const c = charById(S.activeId); c.scene = e.target.value.trim(); save(); renderMain(); toast(c.scene ? "Scene set." : "Scene cleared."); }
});
app.addEventListener("submit", e => {
  if (e.target.id !== "memForm") return;
  e.preventDefault(); const v = $("#memInput").value.trim(); if (!v) return;
  memOf(S.activeId).push(v); save(); renderPanel(); $("#memInput")?.focus();
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && layer.innerHTML) closeModal(); });

render();
})();
</script>
