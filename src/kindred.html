<title>Kindred</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: three panes (companions · conversation · profile) collapsing to one swapped pane on phones.
   Accent hue is user-selectable (--accent-h); every accent color derives from it. */
:root {
  --accent-h: 350;
  --bg: #f4f1f5;
  --surface: #ffffff;
  --surface-2: #ece7ef;
  --ink: #1e1a23;
  --muted: #6b6274;
  --line: #ddd5e2;
  --accent: hsl(var(--accent-h) 62% 52%);
  --accent-soft: hsl(var(--accent-h) 75% 94%);
  --accent-ink: #ffffff;
  --you: #2b2431;
  --you-ink: #f6f1f8;
  --veil: rgba(244, 241, 245, .84);
  --glow: .13;
  --good: #2f8a5b;
  --warn: #b7791f;
  --shadow: 0 10px 30px rgba(40, 20, 50, .14);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Nunito Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131016; --surface: #1c1820; --surface-2: #26202b; --ink: #f1ebf3; --muted: #a497ab;
    --line: #342c3a; --accent: hsl(var(--accent-h) 100% 72%); --accent-soft: hsl(var(--accent-h) 35% 17%); --accent-ink: #160b10;
    --you: hsl(var(--accent-h) 100% 72%); --you-ink: #160b10; --veil: rgba(19, 16, 22, .8); --glow: .2;
    --good: #5cc98e; --warn: #e6b25a; --shadow: 0 10px 30px rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131016; --surface: #1c1820; --surface-2: #26202b; --ink: #f1ebf3; --muted: #a497ab;
  --line: #342c3a; --accent: hsl(var(--accent-h) 100% 72%); --accent-soft: hsl(var(--accent-h) 35% 17%); --accent-ink: #160b10;
  --you: hsl(var(--accent-h) 100% 72%); --you-ink: #160b10; --veil: rgba(19, 16, 22, .8); --glow: .2;
  --good: #5cc98e; --warn: #e6b25a; --shadow: 0 10px 30px rgba(0, 0, 0, .5); color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); overflow: hidden; }
* { box-sizing: border-box; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }

.app { height: 100%; display: grid; grid-template-columns: 290px minmax(0, 1fr) 330px; }
.app.no-panel { grid-template-columns: 290px minmax(0, 1fr); }
.app.no-panel .panel { display: none; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 14px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { padding: 4px 10px; font-size: 12px; }
.btn.danger { color: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.icon-btn { width: 36px; height: 36px; padding: 0; border-radius: 50%; border: 0; background: transparent; display: inline-grid; place-items: center; color: var(--muted); flex-shrink: 0; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn.on { color: var(--accent); background: var(--accent-soft); }
.icon-btn svg, .btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Sidebar */
.side { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 16px 12px; }
.brand-mark { width: 32px; height: 32px; border-radius: 10px; background: linear-gradient(135deg, var(--accent), hsl(calc(var(--accent-h) + 40) 80% 60%)); display: grid; place-items: center; color: #fff; flex-shrink: 0; }
.brand-mark svg { width: 18px; height: 18px; fill: currentColor; stroke: none; }
.brand h1 { font-size: 23px; font-weight: 800; letter-spacing: -.02em; }
.side-actions { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 0 16px 12px; }
.side .search { margin: 0 16px 8px; padding: 8px 12px; width: auto; }
.list { flex: 1; overflow-y: auto; padding: 4px 8px 8px; display: flex; flex-direction: column; gap: 2px; }
.item { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px; border-radius: 12px; border: 0; background: transparent; text-align: left; width: 100%; }
.item:hover { background: var(--surface-2); }
.item.active { background: var(--accent-soft); }
.item-name { font-weight: 700; display: flex; gap: 6px; align-items: baseline; }
.item-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-rel { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; flex-shrink: 0; }
.item-last { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-last.typing-line { color: var(--accent); font-weight: 600; }
.side-foot { border-top: 1px solid var(--line); padding: 10px 12px; display: flex; gap: 2px; align-items: center; flex-wrap: wrap; }
.side-foot .who { flex: 1; font-size: 13px; color: var(--muted); padding-left: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.provider-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex-shrink: 0; }
.dot.off { background: var(--warn); }
.install { width: 100%; margin-top: 6px; }

/* Avatar */
.av { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; color: #fff; background-size: cover; background-position: center; flex-shrink: 0; text-shadow: 0 1px 2px rgba(0,0,0,.25); user-select: none; position: relative; }
.av.sm { width: 32px; height: 32px; font-size: 13px; }
.av.lg { width: 116px; height: 116px; font-size: 40px; }
.av.xl { width: 150px; height: 150px; font-size: 54px; }
.av.ring { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--accent); }

/* Main */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
.topbar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--surface); min-height: 62px; }
.topbar .title { flex: 1; min-width: 0; padding-left: 2px; }
.topbar .title h2 { font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 6px; align-items: center; }
.topbar .sub.typing-line { color: var(--accent); font-weight: 600; }
.av-btn { border: 0; background: transparent; padding: 0; border-radius: 50%; }
.mood { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; color: var(--ink); }
.mood i { width: 8px; height: 8px; border-radius: 50%; background: hsl(var(--mh, 280) 70% 58%); box-shadow: 0 0 0 3px hsl(var(--mh, 280) 70% 58% / .25); }
.back { display: none; }
.tb-tools { display: flex; gap: 2px; }

.home { flex: 1; overflow-y: auto; padding: 32px 24px 48px; }
.home-inner { max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 26px; }
.hero { position: relative; border-radius: 24px; padding: 32px; overflow: hidden; background: var(--surface); border: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: center; }
.hero::before { content: ""; position: absolute; inset: 0; background: radial-gradient(500px 260px at 100% 0%, hsl(var(--accent-h) 90% 60% / var(--glow)), transparent 70%), radial-gradient(420px 240px at 0% 100%, hsl(calc(var(--accent-h) + 60) 90% 60% / var(--glow)), transparent 70%); pointer-events: none; }
.hero > * { position: relative; }
.hero h2 { font-size: clamp(28px, 4.2vw, 44px); letter-spacing: -.025em; font-weight: 800; }
.hero p { color: var(--muted); max-width: 54ch; margin: 10px 0 18px; }
.hero-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.hero-faces { display: flex; }
.hero-faces .av { width: 64px; height: 64px; font-size: 22px; box-shadow: 0 0 0 4px var(--surface); }
.hero-faces .av + .av { margin-left: -16px; }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.sec-head h3 { font-size: 20px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; text-align: left; transition: transform .15s, border-color .15s; }
.card:hover { border-color: var(--accent); transform: translateY(-2px); }
.card .av { width: 64px; height: 64px; font-size: 24px; }
.card h3 { font-size: 18px; }
.card .meta { font-size: 13px; color: var(--muted); }
.card .blurb { font-size: 14px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card.new { border-style: dashed; justify-content: center; align-items: center; text-align: center; color: var(--muted); min-height: 200px; background: transparent; }
.tag { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.tag.mature { background: var(--accent-soft); color: var(--accent); }

/* Chat */
.chat { flex: 1; overflow-y: auto; padding: 24px 16px 8px; background:
  radial-gradient(900px 520px at 0% 0%, hsl(var(--h1, 300) 80% 60% / var(--glow)), transparent 62%),
  radial-gradient(800px 480px at 100% 100%, hsl(var(--h2, 20) 80% 58% / var(--glow)), transparent 62%), var(--bg); }
.chat.has-backdrop { background: linear-gradient(var(--veil), var(--veil)), var(--backdrop) center / cover no-repeat, var(--bg); }
.chat-inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.scene-banner { align-self: center; font-size: 13px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); padding: 6px 14px; border-radius: 999px; max-width: 100%; text-align: center; }
.msg { display: flex; gap: 10px; align-items: flex-end; max-width: 100%; }
.msg.pop { animation: rise .32s cubic-bezier(.2, .8, .3, 1.2); }
@keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.98); } }
.msg.user { flex-direction: row-reverse; }
.msg-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; max-width: min(78%, 620px); }
.msg.user .msg-body { align-items: flex-end; }
.bubble { padding: 10px 14px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
.msg.assistant .bubble { border-bottom-left-radius: 6px; }
.msg.user .bubble { background: var(--you); color: var(--you-ink); border-color: transparent; border-bottom-right-radius: 6px; }
.bubble em.act { color: var(--muted); font-style: italic; }
.msg.user .bubble em.act { color: inherit; opacity: .8; }
.bubble.err { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.bubble.has-img { padding: 6px; display: flex; flex-direction: column; gap: 6px; }
.bubble.has-img > div { padding: 0 8px 4px; }
.chat-img { display: block; width: min(320px, 100%); aspect-ratio: 3 / 4; object-fit: cover; border-radius: 13px; background: var(--surface-2); cursor: zoom-in; }
.msg-tools { display: flex; gap: 2px; align-items: center; opacity: 0; transition: opacity .15s; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.msg:hover .msg-tools, .msg:focus-within .msg-tools, .msg.last .msg-tools { opacity: 1; }
.msg-tools .icon-btn { width: 28px; height: 28px; }
.msg-tools .icon-btn svg { width: 15px; height: 15px; }
.alt-nav { font-variant-numeric: tabular-nums; padding: 0 2px; }
.typing { display: inline-flex; gap: 4px; padding: 4px 0; align-items: center; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
.typing span { margin-left: 6px; font-size: 13px; color: var(--muted); }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.edit-area { width: min(560px, 70vw); min-height: 90px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 10px; resize: vertical; }

.composer { padding: 10px 16px 14px; background: var(--bg); }
.composer-inner { max-width: 760px; margin: 0 auto; display: flex; gap: 4px; align-items: flex-end; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 6px; box-shadow: var(--shadow); }
.composer-inner:focus-within { border-color: var(--accent); }
.composer textarea { flex: 1; border: 0; border-radius: 0; background: transparent; resize: none; min-height: 0; max-height: 180px; padding: 8px 4px; outline: none; min-width: 0; }
.composer .icon-btn { width: 40px; height: 40px; }
.composer .icon-btn.rec { color: #fff; background: var(--accent); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px hsl(var(--accent-h) 80% 60% / .25); } }
.send { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex-shrink: 0; }
.send svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.send.stop { background: var(--ink); color: var(--bg); }
.composer-hint { max-width: 760px; margin: 6px auto 0; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

/* Profile panel */
.panel { border-left: 1px solid var(--line); background: var(--surface); overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 22px; min-height: 0; }
.panel-head { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.panel-head h3 { font-size: 22px; }
.panel-head .meta { color: var(--muted); font-size: 13px; }
.sect { display: flex; flex-direction: column; gap: 8px; }
.sect-title { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid transparent; }
.bond-bar { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bond-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), hsl(calc(var(--accent-h) + 40) 85% 62%)); border-radius: 999px; transition: width .5s; }
.bond-row { display: flex; justify-content: space-between; font-size: 13px; gap: 8px; }
.bond-row b { font-family: var(--f-display); }
.bond-row span { color: var(--muted); font-variant-numeric: tabular-nums; }
.mem { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.mem li { display: flex; gap: 6px; align-items: flex-start; font-size: 14px; background: var(--bg); border-radius: 10px; padding: 6px 4px 6px 10px; }
.mem li span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.mem li .icon-btn { width: 24px; height: 24px; }
.mem li .icon-btn svg { width: 13px; height: 13px; }
.mem-add { display: flex; gap: 6px; }
.mem-add input { flex: 1; min-width: 0; }
.small { font-size: 13px; color: var(--muted); }
.panel-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.gallery { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.gallery button { padding: 0; border: 0; border-radius: 10px; overflow: hidden; aspect-ratio: 3 / 4; background: var(--surface-2); }
.gallery img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gallery .add { display: grid; place-items: center; color: var(--muted); border: 1px dashed var(--line); background: transparent; }

/* Forms */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .lbl { font-size: 13px; font-weight: 700; }
.hint { font-size: 12px; color: var(--muted); }
input[type="text"], input[type="number"], input[type="password"], input[type="url"], textarea, select { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 12px; }
textarea { resize: vertical; min-height: 80px; }
input:focus, textarea:focus, select:focus { border-color: var(--accent); outline: none; }
input[type="range"] { accent-color: var(--accent); width: 100%; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
.err-text { color: var(--accent); font-size: 13px; font-weight: 600; }
.slider { display: grid; grid-template-columns: 110px minmax(0, 1fr) 110px; gap: 10px; align-items: center; font-size: 13px; }
.slider span:last-child { color: var(--muted); text-align: right; }
.pick { display: flex; flex-wrap: wrap; gap: 6px; }
.pick button { font-size: 13px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.pick button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatches button { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--line); background: hsl(var(--sh) 65% 55%); }
.swatches button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.switch { display: flex; gap: 10px; align-items: flex-start; }
.switch input { width: 18px; height: 18px; accent-color: var(--accent); margin-top: 2px; flex-shrink: 0; }
.callout { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; font-size: 13px; }
.callout.warn { background: var(--accent-soft); }

/* Modal */
.scrim { position: fixed; inset: 0; background: rgba(15, 8, 20, .55); display: grid; place-items: center; padding: 16px; z-index: 20; animation: fade .18s; }
@keyframes fade { from { opacity: 0; } }
.modal { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); width: min(780px, 100%); max-height: calc(100% - 16px); display: flex; flex-direction: column; min-height: 0; animation: rise .25s cubic-bezier(.2, .8, .3, 1.1); }
.modal.narrow { width: min(480px, 100%); }
.modal.wide { width: min(980px, 100%); }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.modal-head h2 { flex: 1; font-size: 20px; }
.modal-body { overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 18px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.tabs { display: flex; gap: 4px; padding: 0 20px; border-bottom: 1px solid var(--line); overflow-x: auto; flex-shrink: 0; }
.tabs button { border: 0; background: transparent; padding: 12px 10px; font-weight: 700; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.look { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 20px; align-items: start; }
.look-side { display: flex; flex-direction: column; gap: 8px; align-items: center; }
.hues { display: flex; gap: 14px; flex-wrap: wrap; }
.hues label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 700; flex: 1; min-width: 120px; }
.drafter { display: flex; gap: 8px; }
.drafter input { flex: 1; min-width: 0; }

/* Creator */
.archetypes { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.arch { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 4px; position: relative; overflow: hidden; }
.arch::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: linear-gradient(90deg, hsl(var(--a1) 75% 58%), hsl(var(--a2) 75% 52%)); }
.arch b { font-family: var(--f-display); font-size: 15px; }
.arch span { font-size: 12px; color: var(--muted); }
.arch[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.preview { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 22px; align-items: start; }
.portrait { width: 100%; aspect-ratio: 3 / 4; border-radius: 18px; display: grid; place-items: center; font-family: var(--f-display); font-size: 64px; font-weight: 800; color: #fff; position: relative; overflow: hidden; }

/* ===================== image store (IndexedDB, memory fallback) ===================== */
const IMG = (() => {
  const mem = new Map(), urls = new Map();
  let dbp = null;
  const open = () => dbp ||= new Promise((res, rej) => {
    try {
      const r = indexedDB.open("kindred", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("images", { keyPath: "id" });
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  });
  const tx = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction("images", mode), req = fn(t.objectStore("images"));
      t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error);
    });
  };
  return {
    async put(id, blob) { mem.set(id, blob); try { await tx("readwrite", s => s.put({ id, blob })); } catch (e) { /* memory only */ } },
    async blob(id) { if (mem.has(id)) return mem.get(id); try { const r = await tx("readonly", s => s.get(id)); if (r) { mem.set(id, r.blob); return r.blob; } } catch (e) { /* none */ } return null; },
    async url(id) { if (urls.has(id)) return urls.get(id); const b = await this.blob(id); if (!b) return ""; const u = URL.createObjectURL(b); urls.set(id, u); return u; },
    async del(id) { mem.delete(id); if (urls.has(id)) { URL.revokeObjectURL(urls.get(id)); urls.delete(id); } try { await tx("readwrite", s => s.delete(id)); } catch (e) { /* none */ } },
  };
})();

  crackle(ctx, vol) {

/* ===================== text providers ===================== */
let samplePromise = null;
function getSample() {
  if (!samplePromise) samplePromise = (window.claude && typeof window.claude.use === "function") ? Promise.resolve(window.claude.use("sample")).catch(() => null) : Promise.resolve(null);
  return samplePromise;
}
let sampleReady = null;
getSample().then(s => { sampleReady = !!s; renderSideFoot(); });

function activeProvider() {
  const p = S.settings.provider;
  if (p !== "auto") return p;
  if (sampleReady) return "claude";
  if (S.settings.openrouter.apiKey) return "openrouter";
  if (S.settings.anthropic.apiKey) return "anthropic";
  if ((S.settings.openai.apiKey || /localhost|127\.0\.0\.1/.test(S.settings.openai.baseUrl)) && S.settings.openai.model) return "openai";
  return "demo";
}
const PROVIDER_NAMES = { claude: "Claude (built-in)", openrouter: "OpenRouter", openai: "OpenAI-compatible", anthropic: "Anthropic API", demo: "Demo mode" };

function normalizeTurns(msgs) {
  const out = [];
  for (const m of msgs) {
    if (!m.content && !m.image) continue;
    const content = m.image ? `${m.content || ""}\n[photo: ${m.caption || "a photo"}]`.trim() : m.content;
    const last = out[out.length - 1];
    if (last && last.role === m.role) last.content += "\n\n" + content;
    else out.push({ role: m.role, content });
  }
  return out;
}
async function readSSE(res, onData) {
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "";
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n")) >= 0) {
      const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
      if (!line.startsWith("data:")) continue;
      const d = line.slice(5).trim();
      if (d === "[DONE]") return;
      let j; try { j = JSON.parse(d); } catch (e) { continue; }
      onData(j);
    }
  }
}
async function httpError(res) {
  let msg = "";
  try { const j = await res.json(); msg = j.error?.message || j.detail || j.message || JSON.stringify(j).slice(0, 200); } catch (e) { msg = res.statusText; }
  const hint = res.status === 401 ? " Check your API key in Settings." : res.status === 404 ? " Check the base URL and model name in Settings." : res.status === 429 ? " You're being rate limited; wait a moment." : "";
  return new Error(`The provider returned ${res.status}: ${msg}.${hint}`);
}
function netError(e) {
  if (e.name === "AbortError") return e;
  return new Error(inViewer
    ? "This page can't reach outside services while it runs inside claude.ai. Use Claude (built-in) or Demo mode here, or open the hosted or local version of Kindred for other providers."
    : `Couldn't reach the provider (${e.message}). Check the URL, your connection, and that the service allows browser requests (CORS).`);
}
const abortErr = partial => { const e = new Error("Stopped"); e.name = "AbortError"; e.partial = partial; return e; };

async function generate({ system, messages, onText = () => {}, signal, maxTokens, temperature, quick = false }) {
  const st = S.settings, prov = activeProvider();
  maxTokens ??= st.maxTokens; temperature ??= st.temperature;
  let turns = normalizeTurns(messages);

  if (prov === "claude") {
    const sample = await getSample();
    if (!sample) throw new Error("Claude (built-in) only works when this app is opened on claude.ai. Pick another provider in Settings.");
    const head = `[Setup for this conversation, follow it for every reply]\n\n${system}\n\n[End of setup. Reply only with your next message.]`;
    if (!turns.length || turns[0].role === "assistant") turns.unshift({ role: "user", content: head + "\n\n(The conversation begins.)" });
    else turns[0] = { role: "user", content: head + "\n\n" + turns[0].content };
    if (turns[turns.length - 1].role !== "user") turns.push({ role: "user", content: "(Continue.)" });
    try {
      const { text } = await sample(turns, { cache: false, signal, modelTier: quick ? "quick" : "default", onText: ({ text }) => onText(text) });
      return text;
    } catch (e) {
      if (e && e.code === "cancelled") throw abortErr(e.text);
      const copy = { not_granted: "Claude access wasn't allowed for this page. Reload and choose Allow, or pick another provider in Settings.", rate_limited: "Claude is rate limiting this page. Wait a minute and try again." };
      const err = new Error(copy[e?.code] || e?.message || "Claude couldn't answer."); err.partial = e?.text; throw err;
    }
  }

  if (prov === "anthropic") {
    const a = st.anthropic;
    if (!a.apiKey) throw new Error("Add your Anthropic API key in Settings.");
    if (turns[0]?.role === "assistant") turns.unshift({ role: "user", content: "(The conversation begins.)" });
    if (turns[turns.length - 1]?.role !== "user") turns.push({ role: "user", content: "(Continue.)" });
    let res;
    try {
      res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST", signal,
        headers: { "content-type": "application/json", "x-api-key": a.apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
        body: JSON.stringify({ model: a.model || "claude-sonnet-5-5", max_tokens: maxTokens, temperature: Math.min(temperature, 1), system, messages: turns, stream: true }),
      });
    } catch (e) { throw netError(e); }
    if (!res.ok) throw await httpError(res);
    let text = "", streamErr = null;
    await readSSE(res, d => {
      if (d.type === "content_block_delta" && d.delta?.text) { text += d.delta.text; onText(text); }
      if (d.type === "error") streamErr = new Error(d.error?.message || "The stream stopped with an error.");
    });
    if (streamErr) { streamErr.partial = text; throw streamErr; }
    return text;
  }

  if (prov === "openrouter") {
    const o = st.openrouter;
    if (!o.apiKey) throw new Error("Connect OpenRouter or paste your OpenRouter key in Settings, under AI chat.");
    const extra = { "X-Title": "Kindred" };
    if (/^https?:$/.test(location.protocol)) extra["HTTP-Referer"] = location.origin;
    return chatCompletions({ url: OPENROUTER + "/chat/completions", key: o.apiKey, model: o.model || "openrouter/auto", extra, system, turns, onText, signal, maxTokens, temperature });
  }

  if (prov === "openai") {
    const o = st.openai;
    if (!o.model) throw new Error("Set a model name for your OpenAI-compatible provider in Settings.");
    return chatCompletions({ url: o.baseUrl.replace(/\/+$/, "") + "/chat/completions", key: o.apiKey, model: o.model, system, turns, onText, signal, maxTokens, temperature });
  }

  return demoGenerate({ turns, onText, signal });
}

async function chatCompletions({ url, key, model, extra = {}, system, turns, onText, signal, maxTokens, temperature }) {
  const headers = { "content-type": "application/json", ...extra };
  if (key) headers.authorization = "Bearer " + key;
  let res;
  try {
    res = await fetch(url, { method: "POST", signal, headers,
      body: JSON.stringify({ model, temperature, max_tokens: maxTokens, stream: true, messages: [{ role: "system", content: system }, ...turns] }) });
  } catch (e) { throw netError(e); }
  if (!res.ok) throw await httpError(res);
  let text = "", streamErr = null;
  await readSSE(res, d => {
    if (d.error) streamErr = new Error(d.error.message || "The stream stopped with an error.");
    const t = d.choices?.[0]?.delta?.content; if (t) { text += t; onText(text); }
  });
  if (streamErr && !text) throw streamErr;
  return text;
}

/* ===================== OpenRouter: sign-in (PKCE) and model list ===================== */
const OPENROUTER = "https://openrouter.ai/api/v1";
const OR_VERIFIER = "kindred.openrouter.verifier";
const b64url = bytes => btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const canOAuth = () => !inViewer && /^https?:$/.test(location.protocol) && !!(window.crypto && crypto.subtle);
async function connectOpenRouter() {
  if (!canOAuth()) { toast("Connecting needs the hosted or local version of Kindred. Paste a key from openrouter.ai/keys instead."); return; }
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(32)));
  const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  try { sessionStorage.setItem(OR_VERIFIER, verifier); } catch (e) { toast("This browser blocked storage, so sign-in can't finish. Paste a key instead."); return; }
  const callback = location.origin + location.pathname;
  location.href = `https://openrouter.ai/auth?callback_url=${encodeURIComponent(callback)}&code_challenge=${challenge}&code_challenge_method=S256`;
}
async function finishOpenRouterAuth() {
  const code = new URLSearchParams(location.search).get("code");
  let verifier = null; try { verifier = sessionStorage.getItem(OR_VERIFIER); } catch (e) { /* none */ }
  if (!code || !verifier) return;
  history.replaceState(null, "", location.pathname + location.hash);
  try {
    const res = await fetch(OPENROUTER + "/auth/keys", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ code, code_verifier: verifier, code_challenge_method: "S256" }) });
    if (!res.ok) throw await httpError(res);
    const j = await res.json();
    if (!j.key) throw new Error("OpenRouter didn't return a key.");
    S.settings.openrouter.apiKey = j.key; S.settings.provider = "openrouter"; save();
    try { sessionStorage.removeItem(OR_VERIFIER); } catch (e) { /* fine */ }
    render(); openSettings("ai"); toast("OpenRouter connected. Pick a model, then save.");
  } catch (e) { toast("Couldn't connect OpenRouter: " + (e.message || e)); }
}
let orModels = null;
async function loadOpenRouterModels() {
  let res;
  try { res = await fetch(OPENROUTER + "/models"); } catch (e) { throw netError(e); }
  if (!res.ok) throw await httpError(res);
  const j = await res.json();
  orModels = (j.data || []).filter(m => {
    const out = m.architecture?.output_modalities || [];
    return out.length ? out.includes("text") : !/->(image|audio)$/.test(m.architecture?.modality || "");
  }).map(m => ({ id: m.id, name: m.name || m.id, ctx: m.context_length || 0, inP: Number(m.pricing?.prompt || 0) * 1e6, outP: Number(m.pricing?.completion || 0) * 1e6 }))
    .sort((a, b) => a.name.localeCompare(b.name));
  return orModels;
}
const priceLabel = m => m.inP === 0 && m.outP === 0 ? "free" : `$${m.inP.toFixed(2)} in · $${m.outP.toFixed(2)} out per 1M`;

/* Offline demo: personality-flavored canned replies, streamed, so everything can be tried with no AI at all. */
async function demoGenerate({ turns, onText, signal }) {

  if (/reply with only (a )?json/i.test(last)) return JSON.stringify({ memories: ["(Demo mode) Memory extraction needs a real AI provider."] });

  const bodies = [
    `Okay, I'm listening. Tell me more about that, ${you}.`,
    playful ? "Ha! You can't just drop that on me without context. Details. Now." : "That's interesting. What made you think of it?",
    warm ? "I'm really glad you told me. How are you feeling about it?" : "Hm. I have opinions, but I want yours first.",
    `You know what, that reminds me of something. ${c.interests ? "Have I ever told you how I got into " + c.interests.split(",")[0].trim().toLowerCase() + "?" : "Remind me to tell you later."}`,
  ];
  let reply = `${opener[hash(last) % 3]} ${bodies[hash(last + turns.length) % bodies.length]}`;
  if (/\b(hi|hey|hello|yo)\b/.test(last)) reply = `${opener[0]} Hey you. I was hoping you'd show up.`;
  if (PHOTO_ASK.test(last)) reply = `${opener[2]} Hold on, let me find my good angle…`;
  reply += "\n\n(Demo mode: connect an AI in Settings for real replies.)";
  if (S.settings.moods) reply += `\n<mood>${pickRand(warm ? ["happy", "affectionate", "content"] : ["curious", "amused", "thoughtful"])}</mood>`;
  let out = "";
  for (const w of reply.split(/(\s+)/)) {
    if (signal?.aborted) throw abortErr(out);
    out += w; onText(out);
    await sleep(14);
  }
  return out;
}
function extractJSON(text) {
  const m = text.match(/```(?:json)?\s*([\s\S]*?)```/); if (m) text = m[1];
  const start = text.search(/[{[]/); if (start < 0) throw new Error("No JSON found in the reply.");
  const close = text[start] === "{" ? "}" : "]";
  return JSON.parse(text.slice(start, text.lastIndexOf(close) + 1));
}

function assertAdultPrompt(text) {

  for (const m of text.matchAll(/\b(\d{1,2})\s*(?:-|\s)?(?:yo|y\/o|yrs?|years?)(?:[- ]old)?\b/gi)) if (+m[1] < 18) throw new Error("Images can't depict anyone under 18.");
}
function buildImagePrompt({ c, prompt, style, includeLook, mature }) {
  const parts = [IMAGE_STYLES[style]?.[1] || IMAGE_STYLES.photo[1]];
  if (c && includeLook) parts.push(`${c.age}-year-old adult ${genderLabel(c)}`, c.appearance, c.lookTags);
  parts.push(prompt);

const NEG_ALWAYS = "child, minor, teen, underage, childlike, young-looking, loli";
const NEG_QUALITY = "deformed, bad anatomy, extra fingers, lowres, blurry, watermark, text, signature";
const b64ToBlob = (b64, type = "image/png") => { const bin = atob(b64), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], { type }); };

async function generateImage({ prompt, shape = "portrait", mature = false, signal, hues = [300, 20] }) {
  assertAdultPrompt(prompt);
  const prov = imageProvider(), [w, h] = SHAPES[shape] || SHAPES.portrait, st = S.settings.image;
  const negative = `${NEG_ALWAYS}, ${NEG_QUALITY}${mature ? "" : ", nsfw, nude, nudity, explicit"}`;
  if (prov === "off") throw new Error("Image generation is off. Turn it on in Settings, under Images.");

  if (prov === "pollinations") {
    const seedN = Math.floor(Math.random() * 1e9);
    const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=${w}&height=${h}&seed=${seedN}&nologo=true&model=${encodeURIComponent(st.pollinationsModel || "flux")}&negative=${encodeURIComponent(negative)}${mature ? "" : "&safe=true"}`;
    let res; try { res = await fetch(url, { signal }); } catch (e) { throw netError(e); }
    if (!res.ok) throw await httpError(res);
    const blob = await res.blob();
    if (!blob.type.startsWith("image/")) throw new Error("Pollinations didn't return an image. Try again in a moment.");
    return blob;
  }
  if (prov === "openai") {
    const o = st.openai;
    if (!o.apiKey && !/localhost|127\.0\.0\.1/.test(o.baseUrl)) throw new Error("Add an API key for your image provider in Settings.");
    const dalle3 = /dall-e-3/.test(o.model);
    const size = shape === "square" ? "1024x1024" : dalle3 ? (shape === "portrait" ? "1024x1792" : "1792x1024") : (shape === "portrait" ? "1024x1536" : "1536x1024");
    const body = { model: o.model, prompt, n: 1, size };
    if (/dall-e/.test(o.model)) body.response_format = "b64_json";
    let res;
    try { res = await fetch(o.baseUrl.replace(/\/+$/, "") + "/images/generations", { method: "POST", signal, headers: { "content-type": "application/json", ...(o.apiKey ? { authorization: "Bearer " + o.apiKey } : {}) }, body: JSON.stringify(body) }); }
    catch (e) { throw netError(e); }
    if (!res.ok) throw await httpError(res);
    const j = await res.json(), d = j.data?.[0];
    if (d?.b64_json) return b64ToBlob(d.b64_json);
    if (d?.url) { const r = await fetch(d.url, { signal }); return await r.blob(); }
    throw new Error("The image provider returned no image.");
  }
  if (prov === "a1111") {
    const a = st.a1111;
    let res;
    try {
      res = await fetch(a.baseUrl.replace(/\/+$/, "") + "/sdapi/v1/txt2img", { method: "POST", signal, headers: { "content-type": "application/json" },
        body: JSON.stringify({ prompt, negative_prompt: negative, width: w, height: h, steps: a.steps, cfg_scale: a.cfg, sampler_name: a.sampler }) });
    } catch (e) { if (e.name === "AbortError") throw e; throw new Error("Couldn't reach Stable Diffusion WebUI. Start it with --api --cors-allow-origins=* and check the URL in Settings."); }
    if (!res.ok) throw await httpError(res);
    const j = await res.json();
    if (!j.images?.[0]) throw new Error("Stable Diffusion returned no image.");
    return b64ToBlob(j.images[0]);
  }
  if (prov === "svg") {
    const out = await generate({
      maxTokens: 6000, temperature: 0.8, signal,
      system: "You are an illustrator who draws with SVG code.",
      messages: [{ role: "user", content: `Draw an original, tasteful SVG illustration of: ${prompt}.\nRequirements: one <svg> element with xmlns="http://www.w3.org/2000/svg" and viewBox="0 0 ${w / 2} ${h / 2}"; fill the whole background; layered flat vector shapes with gradients for depth; a stylized, appealing figure if a person is described; no text, no <script>, no <image>, no external links. Reply with only the SVG code.` }],
    });
    const m = out.match(/<svg[\s\S]*<\/svg>/i);
    if (!m) throw new Error("Claude didn't return a drawing. Try again.");
    let svg = m[0].replace(/<script[\s\S]*?<\/script>/gi, "").replace(/<foreignObject[\s\S]*?<\/foreignObject>/gi, "").replace(/\son\w+\s*=\s*("[^"]*"|'[^']*')/gi, "").replace(/(href\s*=\s*["'])(?!#)[^"']*/gi, "$1#");
    if (!/xmlns=/.test(svg)) svg = svg.replace(/<svg/i, '<svg xmlns="http://www.w3.org/2000/svg"');
    return new Blob([svg], { type: "image/svg+xml" });
  }
  // demo: an offline placeholder portrait so the whole image flow can be tried anywhere
  await sleep(500);
  if (signal?.aborted) throw abortErr("");
  const cv = document.createElement("canvas"); cv.width = w / 2; cv.height = h / 2;
  const g = cv.getContext("2d"), W = cv.width, H = cv.height, seedH = hash(prompt + Math.random());

  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 14; i++) { g.fillStyle = `hsla(${(hues[0] + i * 25) % 360}, 90%, 85%, .18)`; g.beginPath(); g.arc((seedH * (i + 3)) % W, (seedH * (i + 7)) % H, 12 + (i * 7) % 40, 0, 7); g.fill(); }
  g.fillStyle = "rgba(20,10,25,.55)";
  g.beginPath(); g.arc(W / 2, H * 0.42, Math.min(W, H) * 0.16, 0, 7); g.fill();
  g.beginPath(); g.ellipse(W / 2, H * 0.98, W * 0.34, H * 0.32, 0, Math.PI, 0); g.fill();
  g.fillStyle = "rgba(255,255,255,.92)"; g.font = `700 ${Math.round(W / 18)}px system-ui, sans-serif`; g.textAlign = "center";
  g.fillText("Placeholder image", W / 2, H * 0.1);
  g.font = `${Math.round(W / 28)}px system-ui, sans-serif`; g.fillText("Connect an image provider in Settings", W / 2, H * 0.1 + W / 16);
  return await new Promise(res => cv.toBlob(res, "image/png"));
}

/* ===================== chat actions ===================== */
const SPICY_RX = /\b(nude|naked|topless|nothing on|lingerie|underwear|bra|panties|sexy|spicy|hot|nsfw|naughty|risqu[eé]|bedroom)\b/i;
const PHOTO_ASK = /\b(send|show|share|take|snap)\b[^.?!]{0,40}\b(pic|pics|picture|pictures|photo|photos|selfie|selfies|image)\b|\bpic(ture)? of (you|yourself)\b|\b(send|show)\b[^.?!]{0,20}\bnudes?\b/i;

async function send(text) {
  const c = charById(S.activeId); if (!c || ui.busy) return;
  const msgs = chatOf(c.id);
  if (text) {
    const m = { id: uid(), role: "user", content: text, ts: Date.now() };
    msgs.push(m); ui.popId = m.id;
    S.bond[c.id] = (S.bond[c.id] || 0) + 1;
    delete ui.drafts[c.id];
    save(); renderPanel(); AudioKit.chime("send");
  }
  const wantsPhoto = text && S.settings.image.autoPhotos && imageProvider() !== "off" && PHOTO_ASK.test(text);
  const ok = await reply(c);
  if (ok && wantsPhoto && charById(c.id)) await sendSelfie(c, text);
}

async function reply(c, target) {
  const ctl = new AbortController();
  ui.busy = { charId: c.id, ctl, pending: true, label: "typing…" };
  const msgs = chatOf(c.id);
  const history = (target ? msgs.slice(0, msgs.indexOf(target)) : msgs).filter(m => !m.error).slice(-S.settings.historyLimit);
  renderMsgs(); setBusyUI(); renderList();
  let live = null;
  const onText = t => {
    if (S.activeId !== c.id) return;
    if (!live) {
      $("#pending")?.remove();
      if (target) live = $(`[data-mid="${target.id}"] .bubble`);
      else { $("#msgs")?.insertAdjacentHTML("beforeend", `<div class="msg assistant pop" id="streaming">${avatarHTML(c, "sm")}<div class="msg-body"><div class="bubble"></div></div></div>`); live = $("#streaming .bubble"); }
    }
    if (live) { live.innerHTML = fmt(stripMoodLive(t)); const ch = $("#chat"); if (ch && ch.scrollHeight - ch.scrollTop - ch.clientHeight < 160) scrollChat(); }
  };
  let raw = "", error = null, aborted = false;
  try { raw = await generate({ system: systemPrompt(c), messages: history, onText, signal: ctl.signal }); }
  catch (e) { raw = e.partial || ""; if (e.name === "AbortError") aborted = true; else error = e.message || String(e); }
  ui.busy = null;
  const { text, mood } = splitMood(raw || "");
  let newMsg = null;
  if (text) {
    if (target) { target.alts ||= [target.content]; target.alts.push(text); target.altIndex = target.alts.length - 1; target.content = text; target.mood = mood; }
    else { newMsg = { id: uid(), role: "assistant", content: text, ts: Date.now(), mood }; msgs.push(newMsg); }
    if (mood) c.mood = mood;
  }
  if (error) msgs.push({ id: uid(), role: "assistant", content: error, ts: Date.now(), error: true });
  save();
  if (S.activeId === c.id) { renderMsgs(); setBusyUI(); if (mood) renderPanel(); }
  renderList();
  if (text && !error) {
    AudioKit.chime("recv");
    if (S.settings.autoSpeak && S.activeId === c.id) Voice.speak(text, c, (newMsg || target).id);
  }
  return !error && !aborted;
}

function regen() {
  const c = charById(S.activeId); if (!c || ui.busy) return;
  const msgs = chatOf(c.id);
  while (msgs.length && msgs[msgs.length - 1].error) msgs.pop();
  const last = msgs[msgs.length - 1];
  if (last && last.role === "assistant" && !last.image && msgs.length > 1) reply(c, last);
  else if (last && last.role === "assistant" && !last.image) { msgs.pop(); reply(c); }
  else reply(c);
}

function selfiePrompt(c, request = "") {
  const r = request.toLowerCase();
  const spicy = matureAllowed(c) && SPICY_RX.test(r);
  const what = spicy ? (/nude|naked|topless|nothing on/.test(r) ? "intimate nude selfie, bedroom, soft light" : /lingerie|underwear|bra|panties/.test(r) ? "flirty selfie in lingerie, bedroom mirror" : "sexy, flirty selfie, bedroom, teasing look")
    : /outfit|wearing|dress|clothes/.test(r) ? "full-body mirror selfie showing today's outfit"
    : /where are you|place|view|around/.test(r) ? "selfie showing the place around them"
    : "selfie, looking into the camera";
  const mood = c.mood ? `${c.mood} expression` : "warm smile";
  return `${what}, ${mood}${c.scene ? ", setting: " + c.scene : ""}`;
}
async function sendSelfie(c, request = "") {
  if (ui.busy) return;
  const ctl = new AbortController();
  ui.busy = { charId: c.id, ctl, pending: true, label: `${firstName(c)} is taking a photo…` };
  renderMsgs(); setBusyUI(); renderList();
  const caption = selfiePrompt(c, request);
  let error = null, id = null;
  try {
    const mature = matureAllowed(c);
    const prompt = buildImagePrompt({ c, prompt: caption, style: c.imageStyle, includeLook: true, mature });
    const blob = await generateImage({ prompt, shape: "portrait", mature, signal: ctl.signal, hues: [c.hueA, c.hueB] });
    id = await saveToGallery(c.id, blob, { prompt, caption, style: c.imageStyle });
  } catch (e) { if (e.name !== "AbortError") error = e.message || String(e); }
  ui.busy = null;
  const msgs = chatOf(c.id);
  if (id) { const m = { id: uid(), role: "assistant", content: "*sends you a photo*", image: id, caption, ts: Date.now() }; msgs.push(m); ui.popId = m.id; AudioKit.chime("photo"); }
  if (error) msgs.push({ id: uid(), role: "assistant", content: "The photo didn't come through: " + error, ts: Date.now(), error: true });
  save();
  if (S.activeId === c.id) { renderMsgs(); setBusyUI(); renderPanel(); }
  renderList();
}

async function autoMemories() {
  const c = charById(S.activeId); if (!c) return;
  const recent = chatOf(c.id).filter(m => !m.error && m.content).slice(-30);
  if (recent.length < 2) { toast("Chat a little first, then try again."); return; }
  const you = S.settings.userName || "the user";
  const transcript = recent.map(m => `${m.role === "user" ? you : c.name}: ${m.content}`).join("\n");
  const existing = memOf(c.id);
  toast("Reading the conversation…");
  try {
    const out = await generate({
      quick: true, maxTokens: 500, temperature: 0.3,
      system: "You extract durable memories from a chat for a companion character. Reply with only JSON.",
      messages: [{ role: "user", content: `From this conversation between ${you} and ${c.name}, list up to 6 short, durable facts worth remembering long-term (about ${you}'s life, preferences, plans, feelings, and key shared moments). Skip anything already known.\n\nAlready known:\n${existing.map(m => "- " + m).join("\n") || "(none)"}\n\nConversation:\n${transcript}\n\nReply with only a JSON object like {"memories": ["${you} has a sister named Lea", "..."]}.` }],
    });
    const j = extractJSON(out);
    const add = (j.memories || []).map(s => String(s).trim()).filter(s => s && !existing.includes(s));
    existing.push(...add); save(); renderPanel();
    toast(add.length ? `Remembered ${add.length} new thing${add.length > 1 ? "s" : ""}.` : "Nothing new to remember.");
  } catch (e) { toast("Couldn't update memories: " + (e.message || e)); }
}

/* ===================== voice input ===================== */
function toggleDictation() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast("Voice input isn't supported in this browser. Try Chrome, Edge or Safari."); return; }
  if (ui.rec) { ui.rec.stop(); return; }
  const r = new SR(), input = $("#input"); if (!input) return;
  r.lang = navigator.language || "en-US"; r.interimResults = true; r.continuous = false;
  const base = input.value ? input.value.replace(/\s*$/, " ") : "";
  r.onresult = e => { let t = ""; for (const res of e.results) t += res[0].transcript; input.value = base + t; autosize(input); ui.drafts[S.activeId] = input.value; };
  r.onerror = e => toast(e.error === "not-allowed" || e.error === "service-not-allowed" ? "Microphone access is blocked here. Allow it in your browser, or type instead." : "Voice input stopped: " + e.error);
  r.onend = () => { ui.rec = null; $("#micBtn")?.classList.remove("rec"); };
  try { r.start(); ui.rec = r; $("#micBtn")?.classList.add("rec"); } catch (e) { toast("Couldn't start voice input."); }
}

  layer.innerHTML = `<div class="scrim" id="scrim"><div class="modal ${size}" role="dialog" aria-modal="true">${html}</div></div>`;
  const scrim = $("#scrim");
  if (!locked) scrim.addEventListener("mousedown", e => { if (e.target === scrim) closeModal(); });
  layer._locked = locked;
  layer._onClose = onClose;
  setTimeout(() => $("#scrim .modal input[type=text], #scrim .modal textarea")?.focus({ preventScroll: true }), 0);

}

function commitCharacter(c, isEdit) {
  if (isEdit) { const i = S.characters.findIndex(x => x.id === c.id); S.characters[i] = c; }

async function draftCharacter(idea, current) {
  const out = await generate({
    maxTokens: 1500, temperature: 0.95,
    system: "You design characters for a companion chat app. Every character is an adult (18+). Reply with only JSON.",
    messages: [{ role: "user", content: `Design a companion character from this idea: "${idea}".
Reply with only a JSON object with these keys:
name (string, first and last), age (integer, 18 or older), gender ("Woman"|"Man"|"Non-binary"), pronouns, relationship (one of ${RELATIONSHIPS.filter(r => r !== "Custom").join(", ")}), occupation, appearance (2-3 vivid sentences: hair, eyes, skin, build, style), lookTags (comma separated visual details for image generation), traits (3-5 picked from: ${TRAITS.join(", ")}), customTraits (comma separated extras), sliders ({warmth, humor, flirt, energy, boldness}, each 0-100), backstory (3-4 sentences, include how they know the user), interests, likes, dislikes, quirks, speech (how they talk), greeting (their first message, in character, using *asterisks* for actions), scene (a short starting scene),${matureOn() ? " turnOns (what attracts and excites them, comma separated), limits (hard limits, or empty)," : ""} ambience (one of ${Object.keys(AMBIENCES).join(", ")}), imageStyle (one of ${Object.keys(IMAGE_STYLES).join(", ")}).` }],
  });
  const j = extractJSON(out);
  const r = {};
  for (const k of ["name", "pronouns", "occupation", "appearance", "lookTags", "customTraits", "backstory", "interests", "likes", "dislikes", "quirks", "speech", "greeting", "scene"]) if (typeof j[k] === "string") r[k] = j[k];
  if (GENDERS.includes(j.gender)) r.gender = j.gender;
  if (RELATIONSHIPS.includes(j.relationship)) r.relationship = j.relationship;
  if (AMBIENCES[j.ambience]) r.ambience = j.ambience;
  if (IMAGE_STYLES[j.imageStyle]) r.imageStyle = j.imageStyle;
  r.age = Math.max(18, Math.round(+j.age) || 25);
  if (Array.isArray(j.turnOns)) j.turnOns = j.turnOns.join(", ");
  if (typeof j.turnOns === "string") r.turnOns = j.turnOns;
  if (typeof j.limits === "string") r.limits = j.limits;
  if (Array.isArray(j.traits)) r.traits = j.traits.filter(t => TRAITS.includes(t));
  if (isPlainObj(j.sliders)) r.sliders = Object.assign({}, current.sliders, ...SLIDERS.map(([k]) => Number.isFinite(+j.sliders[k]) ? { [k]: clamp(Math.round(+j.sliders[k]), 0, 100) } : {}));
  if (!r.name) throw new Error("The reply didn't include a character.");
  return r;
}

  const hair = pickRand(["Short black hair", "Long auburn waves", "A messy blond crop", "Dark curls", "A sleek silver-dyed bob", "Shoulder-length chestnut hair", "Braids with gold cuffs", "A shaved head"]);

  });
}
function localFromIdea(idea, current) {
  const words = idea.toLowerCase();
  const arch = ARCHETYPES.find(a => a.traits.some(t => words.includes(t.toLowerCase())) || words.includes(a.key)) || pickRand(ARCHETYPES);
  const gender = /\b(girlfriend|woman|she|her|wife|girl)\b/.test(words) ? "Woman" : /\b(boyfriend|man|he|him|husband|guy)\b/.test(words) ? "Man" : "Any";
  const rel = RELATIONSHIPS.find(r => words.includes(r.toLowerCase())) || "Any";
  const d = localCharacter(arch, { gender, relationship: rel });
  delete d.id; delete d.created;
  d.backstory = `${d.backstory} (Your idea: ${idea}.)`;
  return Object.assign({}, d, { voice: current.voice });
}

      <div class="callout warn">Hard limits that no setting changes: every character is an adult, and anything involving minors or childlike depictions is blocked in prompts and images.</div>`;

  const m = openModal(`

    { onClose: () => { applyTheme(); Ambience.setVolume(S.settings.ambienceVol); } });
  const paint = () => { $("#setBody", m).innerHTML = body(); $$("[data-stab]", m).forEach(b => b.setAttribute("aria-selected", b.dataset.stab === tab)); };
  paint();

  m.addEventListener("input", e => {

    if (k === "ambienceVol") Ambience.setVolume(st.ambienceVol);
    if (["provider", "tts.provider", "image.provider"].includes(k)) paint();
    if (k === "ageConfirmed" || k === "mature") { if (!st.ageConfirmed) st.mature = false; paint(); }
  });
  m.addEventListener("input", e => {
    if (e.target.id !== "s-orq") return;
    orQuery = e.target.value; const pos = e.target.selectionStart; paint();
    const q = $("#s-orq", m); q.focus(); q.setSelectionRange(pos, pos);
  });
  m.addEventListener("click", async e => {
    const om = e.target.closest("[data-ormodel]");
    if (om) { st.openrouter.model = om.dataset.ormodel; const keep = $(".or-list", m)?.scrollTop; paint(); const l = $(".or-list", m); if (l) l.scrollTop = keep || 0; return; }
    const tb = e.target.closest("[data-stab]"); if (tb) { tab = tb.dataset.stab; paint(); return; }
    const sw = e.target.closest("[data-accent]"); if (sw) { st.accent = Number(sw.dataset.accent); applyTheme(st); paint(); return; }
    const pb = e.target.closest("[data-pick] button"); if (pb) { st[pb.parentElement.dataset.pick] = pb.dataset.v; applyTheme(st); paint(); return; }
    const a = e.target.closest("[data-s]")?.dataset.s;
    if (a === "close") closeModal();
    if (a === "or-load") { orBusy = true; orErr = ""; paint(); try { await loadOpenRouterModels(); } catch (err) { orErr = err.message || String(err); } orBusy = false; paint(); }
    if (a === "or-forget") { st.openrouter.apiKey = ""; paint(); }
    if (a === "or-connect") { if (st.provider === "auto") st.provider = "openrouter"; S.settings = st; save(); layer._onClose = null; connectOpenRouter(); }
    if (a === "save") {
      st.maxTokens = clamp(st.maxTokens || 600, 64, 4000); st.historyLimit = clamp(st.historyLimit || 40, 4, 200);
      if (!st.ageConfirmed) st.mature = false;
      if (!st.mature) S.characters.forEach(c => { c.mature = false; });
      S.settings = st; layer._onClose = null; save(); closeModal(); Ambience.stop(); render(); toast("Settings saved.");
    }
  });
}

/* ---------- backup ---------- */
function openData() {
  const exportData = () => JSON.stringify({ app: "kindred", version: VERSION, characters: S.characters, chats: S.chats, memories: S.memories, bond: S.bond }, null, 1);
  const m = openModal(`
    <div class="modal-head"><h2>Import and export</h2><button class="icon-btn" data-d="close" aria-label="Close">${ic("x")}</button></div>
    <div class="modal-body">
      <p class="small" style="margin:0">Everything lives in this browser. Copy the backup below to keep it safe or move it to another device. Avatars are included; settings, API keys and gallery images aren't.</p>
      <div class="field"><label for="d-text">Backup</label><textarea id="d-text" rows="10" style="font-family:ui-monospace,monospace;font-size:12px"></textarea></div>
      <div class="panel-actions"><button class="btn" data-d="copy">${ic("copy")} Copy backup</button><button class="btn" data-d="export-one">Current companion only</button></div>
      <div class="field"><span class="lbl">Import</span><span class="hint">Paste a backup or a shared companion into the box above, then choose Import. Imported companions are added alongside yours.</span>
        <div class="panel-actions"><button class="btn primary" data-d="import">Import from box</button><label class="btn" for="d-file">Choose file…</label><input type="file" id="d-file" accept=".json,application/json" hidden></div></div>
    </div>`);
  const ta = $("#d-text", m); ta.value = exportData();
  const doImport = text => {
    try {
      const j = JSON.parse(text);
      const chars = j.characters || (j.name ? [j] : []);
      if (!chars.length) throw new Error("No companions found in that backup.");
      let n = 0;
      for (const raw of chars) {
        const c = mergeDeep(blankCharacter(), raw), oldId = raw.id;
        if (!oldId || charById(c.id)) c.id = uid();
        c.age = Math.max(18, Number(c.age) || 18); c.example = false; c.backdrop = "";
        S.characters.push(c);
        const chat = (j.chats?.[oldId] || []).map(msg => { if (!msg.image) return msg; const { image, ...rest } = msg; return { ...rest, content: msg.content || "*sent a photo*" }; });
        S.chats[c.id] = chat.length ? chat : (c.greeting ? [{ id: uid(), role: "assistant", content: c.greeting, ts: Date.now() }] : []);
        if (j.memories?.[oldId]) S.memories[c.id] = j.memories[oldId];
        if (j.bond?.[oldId]) S.bond[c.id] = j.bond[oldId];
        n++;
      }
      save(); closeModal(); render(); toast(`Imported ${n} companion${n > 1 ? "s" : ""}.`);
    } catch (e) { toast("Couldn't import: " + e.message); }
  };
  m.addEventListener("change", e => { const f = e.target.files?.[0]; if (f) f.text().then(doImport); });
  m.addEventListener("click", e => {
    const a = e.target.closest("[data-d]")?.dataset.d;
    if (a === "close") closeModal();
    if (a === "copy") copyText(ta.value, "Backup copied.", ta);
    if (a === "export-one") { const c = charById(S.activeId); if (!c) { toast("Open a companion first."); return; } const x = structuredClone(c); delete x.id; ta.value = JSON.stringify(x, null, 1); }
    if (a === "import") doImport(ta.value);
  });
}
function copyText(text, okMsg, fallbackEl) {
  const fail = () => { if (fallbackEl) { fallbackEl.select(); toast("Press Ctrl+C (or ⌘C) to copy."); } else toast("Copy isn't available here."); };
  try { navigator.clipboard.writeText(text).then(() => toast(okMsg), fail); } catch (e) { fail(); }
}
function openAbout() {
  openModal(`
    <div class="modal-head"><h2>Kindred ${VERSION}</h2><button class="icon-btn" data-a="close" aria-label="Close">${ic("x")}</button></div>
    <div class="modal-body">
      <p style="margin:0">Design AI companions and talk to them. Your companions, chats, memories and images are saved in this browser.</p>
      <div class="sect"><div class="sect-title">Build log</div><ul class="log">${BUILD_LOG.map(([v, t]) => `<li><b>${v}</b><span>${esc(t)}</span></li>`).join("")}</ul></div>
    </div>`, { size: "narrow" }).addEventListener("click", e => { if (e.target.closest("[data-a]")) closeModal(); });
}

/* ===================== events ===================== */
function openChar(id) { S.activeId = id; ui.view = "chat"; ui.editingMsg = null; Voice.stop(); save(); render(); }
app.addEventListener("click", async e => {
  const open = e.target.closest("[data-open]"); if (open) { openChar(open.dataset.open); return; }
  const zoom = e.target.closest("[data-zoom]"); if (zoom) { openLightbox(zoom.dataset.zoom); return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, c = charById(S.activeId), msgs = c ? chatOf(c.id) : [];
  const msg = el.dataset.id ? msgs.find(m => m.id === el.dataset.id) : null;
  switch (act) {
    case "new": openEditor(); break;
    case "creator": openCreator(); break;
    case "edit": if (c) openEditor(c); break;
    case "settings": openSettings(); break;
    case "settings-ai": openSettings("ai"); break;
    case "studio": openStudio(); break;
    case "data": openData(); break;
    case "about": openAbout(); break;
    case "install": if (ui.installEvt) { ui.installEvt.prompt(); ui.installEvt.userChoice.finally(() => { ui.installEvt = null; renderSideFoot(); }); } break;
    case "list": Voice.stop(); ui.view = homeView(); render(); break;
    case "panel": ui.panel = !ui.panel; app.classList.toggle("no-panel", !ui.panel); break;
    case "send": { const t = $("#input"); const v = t.value.trim(); if (!v && !msgs.length) return; t.value = ""; autosize(t); ui.rec?.stop(); send(v); break; }
    case "stop": ui.busy?.ctl.abort(); break;
    case "regen": regen(); break;
    case "selfie": if (c && !ui.busy) { if (imageProvider() === "off") { toast("Images are off. Turn them on in Settings."); break; } sendSelfie(c); } break;
    case "mic": toggleDictation(); break;
    case "speak": if (msg) { if (Voice.speakingId === msg.id) Voice.stop(); else Voice.speak(msg.content, c, msg.id); } break;
    case "voice-preview": if (c) Voice.speak(c.greeting || `Hi, it's ${firstName(c)}.`, c); break;
    case "autospeak": S.settings.autoSpeak = !S.settings.autoSpeak; if (!S.settings.autoSpeak) Voice.stop(); save(); el.classList.toggle("on", S.settings.autoSpeak); el.innerHTML = ic(S.settings.autoSpeak ? "speaker" : "mute"); toast(S.settings.autoSpeak ? "Replies will be read aloud." : "Read-aloud off."); break;
    case "ambience":
      if (c.ambience === "none") { toast("Pick a background sound in the profile panel."); ui.panel = true; app.classList.remove("no-panel"); $("#ambSelect")?.focus(); break; }
      S.settings.ambienceOn = !S.settings.ambienceOn; save(); el.classList.toggle("on", S.settings.ambienceOn);
      if (S.settings.ambienceOn) Ambience.play(c.ambience); else Ambience.stop();
      toast(S.settings.ambienceOn ? `Playing: ${AMBIENCES[c.ambience]}` : "Background sound off."); break;
    case "copy": if (msg) copyText(msg.content, "Copied."); break;
    case "copy-chat": copyText(msgs.filter(m => !m.error).map(m => `${m.role === "user" ? (S.settings.userName || "You") : c.name}: ${m.content}${m.image ? " [photo]" : ""}`).join("\n\n"), "Transcript copied."); break;
    case "remember": if (msg) { const s = (msg.image ? `sent a photo (${msg.caption || "photo"})` : msg.content).replace(/\s+/g, " ").trim().slice(0, 240); memOf(c.id).push((msg.role === "user" ? "You said: " : `${firstName(c)} said: `) + s); save(); renderPanel(); toast("Saved to memories."); } break;
    case "edit-msg": if (msg && !ui.busy) { ui.editingMsg = msg.id; renderMsgs(false); } break;
    case "cancel-edit": ui.editingMsg = null; renderMsgs(false); break;
    case "save-edit": if (msg) { const v = $("#editArea").value.trim(); if (v) { msg.content = v; if (msg.alts) msg.alts[msg.altIndex] = v; msg.error = false; } ui.editingMsg = null; save(); renderMsgs(false); renderList(); } break;
    case "del-msg": if (msg && !ui.busy) { msgs.splice(msgs.indexOf(msg), 1); save(); renderMsgs(false); renderList(); } break;
    case "alt-prev": case "alt-next": if (msg && !ui.busy) { msg.altIndex = (msg.altIndex + (act === "alt-next" ? 1 : -1) + msg.alts.length) % msg.alts.length; msg.content = msg.alts[msg.altIndex]; save(); renderMsgs(false); } break;
    case "auto-mem": autoMemories(); break;
    case "gallery-all": openGalleryAll(); break;
    case "del-mem": memOf(c.id).splice(Number(el.dataset.i), 1); save(); renderPanel(); break;
    case "duplicate": { const d = structuredClone(c); d.id = uid(); d.name += " (copy)"; d.example = false; d.created = Date.now(); d.backdrop = ""; S.characters.push(d); S.chats[d.id] = d.greeting ? [{ id: uid(), role: "assistant", content: d.greeting, ts: Date.now() }] : []; save(); openChar(d.id); toast("Duplicated."); break; }
    case "clear-chat": if (await askConfirm(`Restart your chat with ${c.name}? Messages are deleted. Memories, gallery and bond stay.`, "Restart chat")) { ui.busy?.ctl.abort(); S.chats[c.id] = c.greeting ? [{ id: uid(), role: "assistant", content: c.greeting, ts: Date.now() }] : []; save(); render(); } break;
    case "delete-char": if (await askConfirm(`Delete ${c.name} for good? Their chat, memories and gallery go too.`, "Delete")) {
      ui.busy?.ctl.abort();
      for (const g of galOf(c.id)) IMG.del(g.id);
      S.characters = S.characters.filter(x => x.id !== c.id); delete S.chats[c.id]; delete S.memories[c.id]; delete S.bond[c.id]; delete S.gallery[c.id];
      S.activeId = null; ui.view = homeView(); save(); render(); toast("Deleted.");
    } break;
  }
});
app.addEventListener("input", e => {
  if (e.target.id === "search") { ui.search = e.target.value; renderList(); }
  if (e.target.id === "input") { autosize(e.target); ui.drafts[S.activeId] = e.target.value; }
});
app.addEventListener("change", e => {
  if (e.target.id === "ambSelect") {
    const c = charById(S.activeId); c.ambience = e.target.value;
    if (c.ambience !== "none") S.settings.ambienceOn = true;
    save(); Ambience.stop(); Ambience.play(c.ambience);
    const b = $('[data-act="ambience"]'); if (b) { b.classList.toggle("on", S.settings.ambienceOn && c.ambience !== "none"); b.title = "Background sound: " + AMBIENCES[c.ambience]; }
  }
});
app.addEventListener("keydown", e => {
  if (e.target.id === "input" && e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!ui.busy) $("#sendBtn").click(); }
  if (e.target.id === "editArea" && e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $('[data-act="save-edit"]')?.click(); }
  if (e.target.id === "editArea" && e.key === "Escape") { ui.editingMsg = null; renderMsgs(false); }
  if (e.target.id === "sceneInput" && e.key === "Enter") { const c = charById(S.activeId); c.scene = e.target.value.trim(); save(); renderMain(); toast(c.scene ? "Scene set." : "Scene cleared."); }
});
app.addEventListener("submit", e => {
  if (e.target.id !== "memForm") return;
  e.preventDefault(); const v = $("#memInput").value.trim(); if (!v) return;
  memOf(S.activeId).push(v); save(); renderPanel(); $("#memInput")?.focus();
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && layer.innerHTML && !(layer._locked && $("#ob-start"))) closeModal(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) Ambience.stop(); else if (!layer.innerHTML) resumeChatAmbience(); });
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); ui.installEvt = e; renderSideFoot(); });
if (!inViewer && "serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});

render();
if (!S.settings.onboarded || !S.settings.ageConfirmed) openWelcome();
else finishOpenRouterAuth();
})();
</script>
